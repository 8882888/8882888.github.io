<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">전국 자전거길종주탁송 · 텍스트 안내</title>
<desc id="desc">자동차·사람 그림 없이 자전거 종주 코스와 차량 회수 상담 방법만 표시하는 안내 카드.</desc>
<rect width="1200" height="630" fill="#f2f7fd"/>
<rect width="1200" height="116" fill="#0a466f"/>
<text x="60" y="78" font-family="sans-serif" font-size="40" font-weight="700" fill="#ffffff">스마트24 전국 자동차탁송 · 1811-4294</text>
<text x="60" y="228" font-family="sans-serif" font-size="58" font-weight="900" fill="#073b68">전국 자전거길종주탁송</text>
<rect x="60" y="260" width="1080" height="3" fill="#b5cce2"/>
<text x="60" y="340" font-family="sans-serif" font-size="37" font-weight="700" fill="#144974">종주 출발지 고객 자동차 → 종료지 차량회수</text>
<text x="60" y="412" font-family="sans-serif" font-size="23" fill="#325e78">영산강길 · 섬진강길 · 동해안길 · 금강길 · 오천길 · 낙동강길</text>
<rect x="60" y="452" width="1080" height="115" rx="16" fill="#e0efff"/>
<text x="600" y="510" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="800" fill="#064675">자동차 회수 · 주차장 위치와 인계 시각 확인</text>
<text x="600" y="550" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#31516d">실제 배차 가능 여부와 요금은 상담 후 확정</text>
</svg>