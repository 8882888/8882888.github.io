<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="cycling-centers-svg-title cycling-centers-svg-desc" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid #b2cce6;background:#f3f8ff"><title id="cycling-centers-svg-title">동해안 강원·경북 공식 자전거길 인증센터 순서</title><desc id="cycling-centers-svg-desc">강원 통일전망대, 북천철교, 봉포해변, 영금정, 동호해변, 지경공원, 경포해변, 정동진, 망상해변, 추암촛대바위, 한재공원, 임원. 경북 울진은어다리, 망양휴게소, 월송정, 고래불해변, 해맞이공원. 두 구간은 별도의 공식 구간이며 양방향 이동을 고려한다.</desc><rect x="16" y="16" width="868" height="194" rx="16" fill="#fff"/><rect x="16" y="228" width="868" height="194" rx="16" fill="#fff"/><text x="38" y="54" font-size="25" font-family="sans-serif" font-weight="700" fill="#123f68">동해안 강원 인증센터</text><text x="38" y="90" textLength="790" lengthAdjust="spacingAndGlyphs" font-size="18" font-family="sans-serif" fill="#244b6b">통일전망대 → 북천철교 → 봉포해변 → 영금정 → 동호해변 → 지경공원</text><text x="38" y="122" textLength="790" lengthAdjust="spacingAndGlyphs" font-size="18" font-family="sans-serif" fill="#244b6b">→ 경포해변 → 정동진 → 망상해변 → 추암촛대바위 → 한재공원 → 임원</text><path d="M40 151 H850" stroke="#2076ac" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="151" r="10" fill="#2076ac"/><circle cx="840" cy="151" r="10" fill="#2076ac"/><text x="38" y="188" font-size="16" font-family="sans-serif" fill="#4a6277">역방향은 반대 순서 · 자동차 인계 방향은 별도 확인</text><text x="38" y="267" font-size="25" font-family="sans-serif" font-weight="700" fill="#123f68">동해안 경북 인증센터</text><text x="38" y="307" textLength="790" lengthAdjust="spacingAndGlyphs" font-size="20" font-family="sans-serif" fill="#244b6b">울진은어다리 → 망양휴게소 → 월송정 → 고래불해변 → 해맞이공원</text><path d="M40 338 H850" stroke="#2076ac" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="338" r="10" fill="#2076ac"/><circle cx="840" cy="338" r="10" fill="#2076ac"/><text x="38" y="384" font-size="16" font-family="sans-serif" fill="#4a6277">공식 코스 구분 · 실제 인증센터 사진 아님 · 스마트24 1811-4294</text></svg>