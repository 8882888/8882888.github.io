<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="river-cycle-svg-title river-cycle-svg-desc" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid #b2cce6;background:#f3f8ff"><title id="river-cycle-svg-title">영산강·섬진강·금강·낙동강 종주 차량회수 대표 구간</title><desc id="river-cycle-svg-desc">영산강 담양댐에서 영산강하구둑, 섬진강 섬진강댐에서 배알도수변공원, 금강 대청댐에서 금강하구둑, 낙동강 안동댐에서 낙동강하구둑. 실제 자동차 인계 장소는 별도 확인.</desc><text x="24" y="39" font-family="sans-serif" font-size="26" font-weight="700" fill="#123f68">전국 강 자전거길 종주 · 차량회수 상담 구간</text><rect x="18" y="62" width="864" height="72" rx="12" fill="#ffffff"/><text x="36" y="95" font-family="sans-serif" font-size="22" font-weight="700" fill="#123f68">영산강 자전거길</text><text x="270" y="95" font-family="sans-serif" font-size="20" fill="#244b6b">담양댐 → 영산강하구둑</text><text x="36" y="122" font-family="sans-serif" font-size="14" fill="#536b80">대표 상담 구간 · 차량 인계 장소와 실제 종주 방향은 별도 확인</text><rect x="18" y="145" width="864" height="72" rx="12" fill="#eef5fd"/><text x="36" y="178" font-family="sans-serif" font-size="22" font-weight="700" fill="#123f68">섬진강 자전거길</text><text x="270" y="178" font-family="sans-serif" font-size="20" fill="#244b6b">섬진강댐 → 배알도수변공원</text><text x="36" y="205" font-family="sans-serif" font-size="14" fill="#536b80">대표 상담 구간 · 차량 인계 장소와 실제 종주 방향은 별도 확인</text><rect x="18" y="228" width="864" height="72" rx="12" fill="#ffffff"/><text x="36" y="261" font-family="sans-serif" font-size="22" font-weight="700" fill="#123f68">금강 자전거길</text><text x="270" y="261" font-family="sans-serif" font-size="20" fill="#244b6b">대청댐 → 금강하구둑</text><text x="36" y="288" font-family="sans-serif" font-size="14" fill="#536b80">대표 상담 구간 · 차량 인계 장소와 실제 종주 방향은 별도 확인</text><rect x="18" y="311" width="864" height="72" rx="12" fill="#eef5fd"/><text x="36" y="344" font-family="sans-serif" font-size="22" font-weight="700" fill="#123f68">낙동강 자전거길</text><text x="270" y="344" font-family="sans-serif" font-size="20" fill="#244b6b">안동댐 → 낙동강하구둑</text><text x="36" y="371" font-family="sans-serif" font-size="14" fill="#536b80">대표 상담 구간 · 차량 인계 장소와 실제 종주 방향은 별도 확인</text></svg>