<text x="60" y="243" font-family="sans-serif" font-size="70" font-weight="bold" fill="#104374">전국 대리운전</text>
<rect x="60" y="290" width="1080" height="3" fill="#b9d4ec"/>
<text x="60" y="367" font-family="sans-serif" font-size="35" fill="#245478">일반 · 심야 · 장거리 · 법인 · 일일기사</text>
<rect x="60" y="415" width="1080" height="135" rx="18" fill="#e2efff"/>
<text x="600" y="490" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="bold" fill="#003c7c">1811-4294</text>
<text x="600" y="533" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#355b79">출발지·도착지·일정 확인 후 안내</text>
