<svg xmlns="http://www.w3.org/2000/svg" width="900" height="742" viewBox="0 0 900 742" role="img" aria-labelledby="title desc"><title id="title">지리산 차량탁송 요금 안내</title><desc id="desc">성삼재 → 중산리 12만원, 성삼재 → 대원사 12만원, 화엄사 → 중산리 12만원, 화엄사 → 대원사 10만원, 백무동 → 중산리 10만원, 백무동 → 대원사 10만원</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09264f"/><stop offset="1" stop-color="#0e6e9a"/></linearGradient></defs><rect width="900" height="742" fill="#f4f8fc"/><rect width="900" height="230" fill="url(#bg)"/><path d="M0 225 L125 130 L240 205 L370 112 L535 220 L690 148 L900 225 Z" fill="#79b8aa" opacity=".3"/><text x="40" y="70" font-size="30" font-weight="800" fill="#ffdf57">전 직원 100% 보험가입 안전운행</text><text x="40" y="145" font-size="62" font-weight="900" fill="#fff">지리산 탁송요금</text><text x="40" y="195" font-size="26" fill="#e0f5ff">성삼재 · 화엄사 · 백무동 · 중산리 · 대원사</text><g transform="translate(35 260)"><rect width="400" height="98" rx="14" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><rect width="13" height="98" rx="6" fill="#1761ab"/><text x="33" y="38" fill="#17304f" font-size="25" font-weight="800">성삼재 → 중산리</text><text x="33" y="78" fill="#d92121" font-size="34" font-weight="900">12만원</text></g><g transform="translate(463 260)"><rect width="400" height="98" rx="14" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><rect width="13" height="98" rx="6" fill="#1761ab"/><text x="33" y="38" fill="#17304f" font-size="25" font-weight="800">성삼재 → 대원사</text><text x="33" y="78" fill="#d92121" font-size="34" font-weight="900">12만원</text></g><g transform="translate(35 374)"><rect width="400" height="98" rx="14" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><rect width="13" height="98" rx="6" fill="#1761ab"/><text x="33" y="38" fill="#17304f" font-size="25" font-weight="800">화엄사 → 중산리</text><text x="33" y="78" fill="#d92121" font-size="34" font-weight="900">12만원</text></g><g transform="translate(463 374)"><rect width="400" height="98" rx="14" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><rect width="13" height="98" rx="6" fill="#1761ab"/><text x="33" y="38" fill="#17304f" font-size="25" font-weight="800">화엄사 → 대원사</text><text x="33" y="78" fill="#d92121" font-size="34" font-weight="900">10만원</text></g><g transform="translate(35 488)"><rect width="400" height="98" rx="14" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><rect width="13" height="98" rx="6" fill="#1761ab"/><text x="33" y="38" fill="#17304f" font-size="25" font-weight="800">백무동 → 중산리</text><text x="33" y="78" fill="#d92121" font-size="34" font-weight="900">10만원</text></g><g transform="translate(463 488)"><rect width="400" height="98" rx="14" fill="#fff" stroke="#cbd9e9" stroke-width="2"/><rect width="13" height="98" rx="6" fill="#1761ab"/><text x="33" y="38" fill="#17304f" font-size="25" font-weight="800">백무동 → 대원사</text><text x="33" y="78" fill="#d92121" font-size="34" font-weight="900">10만원</text></g><text x="37" y="653" font-size="21" fill="#41546a">※ 안내 요금은 첨부된 요금표 기준이며 예약 시 조건을 재확인하세요.</text><text x="37" y="695" font-size="27" font-weight="800" fill="#0a3e73">산행 종주 차량탁송 · 상담 1811-4294</text></svg>