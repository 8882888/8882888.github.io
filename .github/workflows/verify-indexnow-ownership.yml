name: Verify IndexNow key ownership and priority sitemap
on:
  pull_request:
    paths:
      - 'scripts/verify-indexnow-sitemap-ownership.js'
      - 'eb61a299742f4ae6a53efc03717a702a.txt'
      - '770f921af32e749f64c1d447c607ea42.txt'
      - '.github/workflows/verify-indexnow-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only verification script
        run: node --check scripts/verify-indexnow-sitemap-ownership.js
      - name: Verify public key ownership and discovery
        run: node scripts/verify-indexnow-sitemap-ownership.js
