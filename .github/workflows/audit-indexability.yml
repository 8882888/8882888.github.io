name: Full sitemap URL indexability audit
on:
  workflow_dispatch:
  workflow_run:
    # Always inspect production after a release check, including failed ones.
    workflows: ['Verify official Cloudtype release matches GitHub main']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
concurrency:
  group: smart24-indexability-audit
  cancel-in-progress: false
jobs:
  audit:
    # Failed deployments can leave stale URL inventory; audit independently.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locality coverage metrics exclude nonregional service pages
        run: node --test tests/indexability-scope.test.mjs
      - name: Test bounded transient HTTP retries
        run: node --test tests/indexability-retry.test.mjs
      - name: Read-only full sitemap audit
        run: node scripts/audit-indexability.mjs
      - name: Upload full audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-indexability-audit
          retention-days: 30
          path: |
            indexability-audit.json
            indexability-audit.csv
            indexability-summary.md
          if-no-files-found: warn
