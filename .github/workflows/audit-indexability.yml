name: Full sitemap URL indexability audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-indexability.mjs'
      - '.github/workflows/audit-indexability.yml'
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
concurrency:
  group: smart24-indexability-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read-only full sitemap audit
        run: node scripts/audit-indexability.mjs
      - name: Upload full audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-indexability-audit
          retention-days: 30
          path: |
            indexability-audit.json
            indexability-audit.csv
            indexability-summary.md
          if-no-files-found: warn
