name: Full sitemap URL indexability audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-indexability.mjs'
      - 'scripts/indexability-content-quality.mjs'
      - 'scripts/indexability-scope.mjs'
      - 'tests/indexability-scope.test.mjs'
      - 'tests/indexability-content-quality.test.mjs'
      - '.github/workflows/audit-indexability.yml'
  # Full HTTP scans are expensive. Do not enqueue a 120-minute scan on every
  # frequent deployment-parity check (including failed releases): those runs
  # create a backlog and prevent one complete diagnostic from finishing.
  # Hourly Yeti/priority sitemap monitoring remains in its separate workflow.
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
concurrency:
  group: smart24-indexability-audit
  cancel-in-progress: false
jobs:
  audit:
    # Failed deployments can leave stale URL inventory; audit independently.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locality coverage metrics exclude nonregional service pages
        run: node --test tests/indexability-scope.test.mjs
      - name: Test bounded transient HTTP retries
        run: node --test tests/indexability-retry.test.mjs
      - name: Test full-sitemap editorial quality review signals
        run: node --test tests/indexability-content-quality.test.mjs
      - name: Read-only full sitemap audit
        env:
          AUDIT_WORKERS: '2'
          AUDIT_LIVE_DELAY_MS: '350'
        run: node scripts/audit-indexability.mjs
      - name: Upload full audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-indexability-audit
          retention-days: 30
          path: |
            indexability-audit.json
            indexability-audit.csv
            indexability-summary.md
          if-no-files-found: warn
