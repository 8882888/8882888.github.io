name: Full sitemap URL indexability audit
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to Cloudtype']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
concurrency:
  group: smart24-indexability-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify locality coverage metrics exclude nonregional service pages
        run: node --test tests/indexability-scope.test.mjs
      - name: Read-only full sitemap audit
        run: node scripts/audit-indexability.mjs
      - name: Upload full audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-indexability-audit
          retention-days: 30
          path: |
            indexability-audit.json
            indexability-audit.csv
            indexability-summary.md
          if-no-files-found: warn
