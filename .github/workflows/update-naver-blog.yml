name: Update public Naver blog archive
on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: naver-blog-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS and append new posts
        continue-on-error: true
        run: python scripts/update_naver_blog.py
      - name: Refresh verified public-route fare snapshots
        continue-on-error: true
        run: node scripts/refresh_verified_fares.js
      - name: Rebuild regional review HTML from public posts
        run: python scripts/build_regional_reviews.py
      - name: Update homepage from verified public review links
        run: python scripts/update_homepage_reviews.py
      - name: Build factual route-first ride record case page
        run: python scripts/build_ride_record_stories.py
      - name: Publish up to five verified cases on Smart24 website
        run: python scripts/publish_verified_case.py
      - name: Register canonical published cases in sitemap ownership
        run: node scripts/sync-published-case-sitemap-owners.cjs
      - name: Verify core pages and preserved ride history
        run: python scripts/check_core_content.py
      - name: Ensure each published original ride has a unique verified source title
        run: python tests/verified-published-case-title-unique-20261122.py
      - name: Commit archive and regional pages when changed
        id: publication
        run: |
          git add blog/posts.json blog/index.html index.html region/ reviews/ride-record-stories/index.html reviews/verified/ data/published-ride-case-ids.json data/verified_fare_quotes.json data/sitemap-url-owners.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Naver archive and regional review HTML"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the verified new case to the existing Cloudtype service
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Published committed case ${{ steps.publication.outputs.commit }}; dispatching existing Cloudtype deployment."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-main.yml/dispatches" -f ref=main
          echo "Cloudtype deployment requested for current main. Final published sitemap proof is checked by verify-live-seo.yml after the deploy succeeds."
