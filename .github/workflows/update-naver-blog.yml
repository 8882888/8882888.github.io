name: Update public Naver blog archive
on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naver-blog-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS and append new posts
        continue-on-error: true
        run: python scripts/update_naver_blog.py
      - name: Refresh verified public-route fare snapshots
        continue-on-error: true
        run: node scripts/refresh_verified_fares.js
      - name: Rebuild regional review HTML from public posts
        run: python scripts/build_regional_reviews.py
      - name: Update homepage from verified public review links
        run: python scripts/update_homepage_reviews.py
      - name: Build factual route-first ride record case page
        run: python scripts/build_ride_record_stories.py
      - name: Publish one new verified case on Smart24 website
        run: python scripts/publish_verified_case.py
      - name: Commit archive and regional pages when changed
        run: |
          git add blog/posts.json blog/index.html index.html region/ reviews/ride-record-stories/index.html reviews/verified/ data/published-ride-case-ids.json data/verified_fare_quotes.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Naver archive and regional review HTML"
            git push
          fi
