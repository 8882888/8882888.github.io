name: Update public Naver blog archive
on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naver-blog-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS and append new posts
        run: python scripts/update_naver_blog.py
      - name: Refresh verified public-route fare snapshots
        run: node scripts/refresh_verified_fares.js
      - name: Rebuild regional review HTML from public posts
        run: python scripts/build_regional_reviews.py
      - name: Update homepage from verified public review links
        run: python scripts/update_homepage_reviews.py
      - name: Commit archive and regional pages when changed
        run: |
          if ! git diff --quiet -- blog/posts.json blog/index.html index.html region/ data/verified_fare_quotes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog/posts.json blog/index.html region/ data/verified_fare_quotes.json
            git commit -m "Update Naver archive and regional review HTML"
            git push
          fi
