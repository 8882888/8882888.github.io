name: Notify Naver of updated pages
on:
  # Manual only: avoid repeated crawl notifications during maintenance.
  workflow_dispatch:
    inputs:
      urls:
        description: 'Updated URLs on jeongukdaeri.kr, separated by spaces (optional)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for production deploy
        run: sleep 120
      - name: Detect changed files
        id: diff
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "files=$(git diff --name-only HEAD^ HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "files=server.js" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit changed pages to Naver IndexNow
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          INDEXNOW_URLS: ${{ inputs.urls }}
        run: node .github/scripts/indexnow.js
