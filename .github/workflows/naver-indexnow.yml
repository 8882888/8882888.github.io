name: Manually notify Naver of explicitly updated canonical pages
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Verified published canonical URLs, separated by spaces'
        required: true
        type: string
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical input and notifier tests
        run: node tests/indexnow-targeting.test.js
      - name: Submit only explicitly selected published URLs after live verification
        env:
          INDEXNOW_CHANGED_FILES: ''
          INDEXNOW_URLS: ${{ inputs.urls }}
        run: node scripts/indexnow-notify.js
