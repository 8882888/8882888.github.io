name: Cloudtype production health check

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'tests/server.test.js'
      - 'Dockerfile'
      - 'data/legal-regions/**'
      - '.github/workflows/cloudtype-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server source
        uses: actions/checkout@v4
      - name: Set up Node.js for server startup test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server syntax and local startup
        run: |
          node --check server.js
          node tests/server.test.js
      - name: Check Cloudtype production routes independently of GitHub Pages
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.CLOUDTYPE_PRODUCTION_URL }}
        run: |
          set -uo pipefail
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::CLOUDTYPE_PRODUCTION_URL is missing. Cloudtype production status was NOT checked."
            exit 1
          fi
          base="${PRODUCTION_URL%/}"
          failed=0
          for route in / /health /assets/smart24-business-card.svg /region/ /places/ /taksong/types/ /sitemap.xml /sitemap-daeri.xml /sitemap-taksong.xml /robots.txt; do
            url="$base$route"
            code=$(curl -L -sS -o /tmp/smart24-response -w '%{http_code}' --connect-timeout 10 --max-time 25 "$url") || code=000
            echo "$code $url"
            if [ "$code" != 200 ]; then
              echo "::error::Production route unavailable: $url ($code)"
              failed=1
            fi
          done
          exit "$failed"
