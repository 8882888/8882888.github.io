name: Cloudtype production health check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudtype-health.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'tests/server.test.js'
      - 'tests/yeti-priority-indexability.test.cjs'
      - 'scripts/check-yeti-priority-indexability.cjs'
      - 'Dockerfile'
      - 'data/legal-regions/**'
      - 'data/verified-trips.json'
      - '.github/workflows/cloudtype-health.yml'
      - 'tests/cloudtype-health-separation.test.cjs'
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server source
        uses: actions/checkout@v4
      - name: Set up Node.js for server startup test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure website and upstream API failures are reported separately
        run: node --test tests/cloudtype-health-separation.test.cjs
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify server syntax and local startup
        run: |
          node --check server.js
          node tests/server.test.js
      - name: Check Cloudtype production routes independently of GitHub Pages
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.CLOUDTYPE_PRODUCTION_URL || 'https://jeongukdaeri.kr' }}
        run: |
          set -uo pipefail
          base="${PRODUCTION_URL%/}"
          failed=0
          for route in / /health /find/ '/api/find-regions?q=%EA%B0%95%ED%99%94&service=daeri&intent=history' /assets/service-taksong-visual.svg /region/ /places/ /places/%EC%BA%A0%ED%95%91%EC%9E%A5/ /taksong/types/ /fare/ /sitemap.xml /sitemap-daeri.xml /sitemap-taksong.xml /robots.txt /taksongdaeri/ /favicon.ico /blog/; do
            url="$base$route"
            code=$(curl -L -sS -o /tmp/smart24-response -w '%{http_code}' --connect-timeout 10 --max-time 25 "$url") || code=000
            echo "$code $url"
            if [ "$code" != 200 ]; then
              echo "::error::Production route unavailable: $url ($code)"
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify million-choice regional finder and protected search results on production
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.CLOUDTYPE_PRODUCTION_URL || 'https://jeongukdaeri.kr' }}
        run: |
          python3 - <<'PYREGION'
          import os, urllib.request, json
          from urllib.parse import urlencode
          base=os.environ['PRODUCTION_URL'].rstrip('/')
          headers={'User-Agent':'Mozilla/5.0 (compatible; Smart24HealthCheck/1.0)', 'Cache-Control':'no-cache'}
          def load(path):
              request=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200,(path,response.status)
                  return response.read().decode('utf-8')
          page=load('/find/')
          assert '1,028,100' in page, 'Million option count missing'
          assert '<meta name="robots" content="index,follow">' in page, 'Canonical finder must be indexable'
          q=urlencode({'q':'강화군','service':'daeri','intent':'history'})
          selected=load('/find/?'+q)
          assert 'noindex,follow' in selected, 'Parameterized lookup must not be indexed'
          assert '인천광역시 강화군' in selected, 'Exact Ganghwa administrative match missing'
          assert '공개 운행후기' in selected, 'Selected review intent missing'
          data=json.loads(load('/api/find-regions?'+q))
          assert data['count']==1028100 and data['selectedIntent']=='history'
          assert any(item['name']=='인천광역시 강화군' for item in data['results'])
          assert 'tel:18114294' in page, 'Phone CTA missing'
          print('PASS: live production /find/, parameterized noindex, verified-region search, intent and JSON API')
          PYREGION

      - name: Verify live mobile homepage original mountain fare posters
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.CLOUDTYPE_PRODUCTION_URL || 'https://jeongukdaeri.kr' }}
        run: |
          python3 - <<'PYMOBILE'
          import os,urllib.request,re,html
          from html.parser import HTMLParser
          base=os.environ['PRODUCTION_URL'].rstrip('/')
          headers={
            'User-Agent':'Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36',
            'Cache-Control':'no-cache',
            'Pragma':'no-cache'
          }
          def fetch(path):
            req=urllib.request.Request(base+path,headers=headers)
            with urllib.request.urlopen(req,timeout=20) as r:
              if r.status!=200: raise SystemExit('HTTP '+str(r.status)+' '+path)
              return r.read(),r.geturl()
          body,_=fetch('/?mobile-mountain-verify='+os.environ.get('GITHUB_SHA','current'))
          page=body.decode('utf-8')
          section_start=page.find('<section id="mobile-direct-image-priority"')
          header_start=page.find('<header')
          if header_start<0 or section_start<=header_start:
            raise SystemExit('FAIL: general-service header must precede the mountain mobile poster section')
          first_section=page[section_start:].split('</section>',1)[0]
          original=[
            '/assets/seoraksan-taksong-fares.svg',
            '/assets/jirisan-taksong-fares.svg'
          ]
          order=[first_section.find('src="'+p+'"') for p in original]
          if min(order)<0 or order!=sorted(order):
            raise SystemExit('FAIL: photo-free mountain fare charts are missing or reversed on live homepage: '+str(order))
          if 'src="/assets/smart24-business-card-inline.webp"' in first_section:
            raise SystemExit('FAIL: removed promotional artwork was restored above text-only mountain charts')
          # Current CSS deliberately displays the photo-free fare charts at
          # every viewport width and switches to one column for small phones.
          # Do not require the retired max-width:1199px breakpoint: a
          # globally visible section is also visible on mobile.
          match=re.search(r'<style id="mobile-direct-image-priority-20261102">(.*?)</style>',page,re.S)
          if not match:
            raise SystemExit('FAIL: approved photo-free fare chart stylesheet missing')
          fare_css=match.group(1)
          if not re.search(r'#mobile-direct-image-priority\s*\{\s*display\s*:\s*block\b',fare_css):
            raise SystemExit('FAIL: approved fare charts are not visible at the default viewport')
          if not re.search(r'@media\s*\(max-width:\s*650px\).*?#mobile-direct-image-priority\s+\.original-fare-grid\s*\{\s*grid-template-columns\s*:\s*1fr',fare_css,re.S):
            raise SystemExit('FAIL: fare charts do not switch to one column for small phones')
          if re.search(r'#mobile-direct-image-priority\s*\{\s*display\s*:\s*none',fare_css):
            raise SystemExit('FAIL: fare posters were explicitly hidden in the approved stylesheet')
          for p in original:
            image_data,_=fetch(p+'?mobile-fare-verify=1')
            if not image_data.lstrip().startswith(b'<svg') or b'<image' in image_data.lower():
              raise SystemExit('FAIL: approved mobile poster is not photo-free SVG: '+p)
            print('PASS live mobile poster SVG:',p,len(image_data),'bytes')
          for mountain in ['seoraksan','jirisan']:
            route='/special/'+mountain+'-transport/'
            sub,_=fetch(route+'?mobile-fare-verify=1')
            sub=sub.decode('utf-8')
            expected='src="/assets/'+mountain+'-taksong-fares.svg"'
            if not sub.split('<body>',1)[-1].lstrip().startswith('<figure id="original-mountain-fare-visual"') or expected not in sub:
              raise SystemExit('FAIL: incorrect first image on mountain destination '+route)
            print('PASS live text-only fare graphic on special page:',route)
          print('PASS live mobile homepage: fare-first and photo-free mountain charts in order')
          PYMOBILE

      - name: Check Naver crawler access to previously restricted URLs
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.CLOUDTYPE_PRODUCTION_URL || 'https://jeongukdaeri.kr' }}
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          for route in /taksongdaeri/ /favicon.ico /blog/ /robots.txt; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 25 -H 'X-Smart24-Monitor: github-health-probe' -A 'Yeti/1.1 (NHN Corp.; http://help.naver.com/robots/)' "$base$route")
            echo "Naver Yeti user agent: $code $base$route"
            test "$code" = 200
          done

      - name: Verify Yeti priority indexing audit checks
        if: always()
        run: node --test tests/yeti-priority-indexability.test.cjs
      - name: Probe priority landing pages with Naver Yeti User-Agent
        if: always()
        run: node scripts/check-yeti-priority-indexability.cjs
      - name: Keep Yeti priority indexability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeti-priority-indexability
          path: audit/yeti-priority-indexability.json
          if-no-files-found: warn
          retention-days: 30

  # Customer-only quota policy: never call the live routing provider from CI, scheduled monitoring, or AI tests.
  # Simulate success and outage responses locally without network access.
  road-distance-mock:
    name: Customer-only distance API policy (offline mock tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test distance handling without consuming customer quota
        run: node --test tests/road-provider-outage-20261121.test.cjs
