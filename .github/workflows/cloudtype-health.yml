name: Cloudtype production health check

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'tests/server.test.js'
      - 'Dockerfile'
      - 'data/legal-regions/**'
      - 'data/verified-trips.json'
      - '.github/workflows/cloudtype-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server source
        uses: actions/checkout@v4
      - name: Set up Node.js for server startup test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify server syntax and local startup
        run: |
          node --check server.js
          node tests/server.test.js
      - name: Check Cloudtype production routes independently of GitHub Pages
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.CLOUDTYPE_PRODUCTION_URL || 'https://jeongukdaeri.kr' }}
        run: |
          set -uo pipefail
          base="${PRODUCTION_URL%/}"
          failed=0
          for route in / /health /assets/smart24-business-card.svg /region/ /places/ /places/%EC%BA%A0%ED%95%91%EC%9E%A5/ /taksong/types/ /fare/ /sitemap.xml /sitemap-daeri.xml /sitemap-taksong.xml /robots.txt; do
            url="$base$route"
            code=$(curl -L -sS -o /tmp/smart24-response -w '%{http_code}' --connect-timeout 10 --max-time 25 "$url") || code=000
            echo "$code $url"
            if [ "$code" != 200 ]; then
              echo "::error::Production route unavailable: $url ($code)"
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify real driving-distance API response
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          endpoint = 'https://white-voice-6eab.k337711.workers.dev/route'
          query = urlencode({'from': '서울역', 'to': '부산역'})
          url = endpoint + '?' + query
          try:
              with urlopen(Request(url, headers={'User-Agent': 'Smart24-Production-Health/1.0', 'Origin': 'https://jeongukdaeri.kr'}), timeout=20) as response:
                  status = response.status
                  content_type = response.headers.get('Content-Type', '')
                  allowed_origin = response.headers.get('Access-Control-Allow-Origin', '')
                  payload = response.read(50000).decode('utf-8', errors='replace')
              print('Distance API HTTP status:', status)
              print('Distance API content type:', content_type)
              print('Distance API allowed origin:', allowed_origin or '(missing)')
              if allowed_origin not in ('https://jeongukdaeri.kr', '*'):
                  raise SystemExit('Distance API browser CORS origin not allowed')
              try:
                  data = json.loads(payload)
              except ValueError:
                  print('Distance API returned non-JSON body (first 200 chars):', payload[:200])
                  raise SystemExit('Distance API JSON validation failed')
              distance = data.get('distanceKm')
              duration = data.get('durationMinutes')
              print('Distance API distanceKm:', distance)
              print('Distance API durationMinutes:', duration)
              if not isinstance(distance, (int, float)) or distance <= 0:
                  print('Distance API response fields:', sorted(data.keys()))
                  raise SystemExit('Distance API missing positive distanceKm')
              if not isinstance(duration, (int, float)) or duration <= 0:
                  raise SystemExit('Distance API missing positive durationMinutes')
              print('PASS: Live driving-distance API returned valid distance and duration')
          except HTTPError as exc:
              print('Distance API HTTP failure:', exc.code)
              print('CORS allow origin:', exc.headers.get('Access-Control-Allow-Origin', '(missing)'))
              print('Response content type:', exc.headers.get('Content-Type', '(missing)'))
              print('Response preview:', exc.read(500).decode('utf-8', errors='replace')[:300])
              raise
          except Exception as exc:
              print('Distance API verification failed:', type(exc).__name__, str(exc)[:300])
              raise
          PY
