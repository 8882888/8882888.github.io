name: Retired GitHub Pages configuration check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'tests/retired-pages-workflow-20261127.test.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'tests/retired-pages-workflow-20261127.test.cjs'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retired publishing workflow cannot deploy
        run: node --test tests/retired-pages-workflow-20261127.test.cjs
      - name: Read actual Pages configuration and public legacy status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          configured="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages')"
          status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://8882888.github.io/)"
          echo "GitHub Pages configured: $configured; legacy public HTTP: $status"
          echo "Pages configured: $configured; legacy HTTP: $status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$configured" != false ] || [ "$status" != 404 ]; then
            echo "::error::Legacy Pages is not confirmed disabled. Repository owner must disable Pages in Settings > Pages. No deployment or settings change was made."
            exit 1
          fi
