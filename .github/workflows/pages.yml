name: Deploy Smart24 nationwide website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://jeongukdaeri.kr
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Restore official legal-dong CSV cache
        uses: actions/cache@v4
        with:
          path: data/official_legal_dong.csv
          key: official-legal-dong-v1-${{ runner.os }}
      - name: Download and import nationwide regions when official data is available
        shell: bash
        run: |
          mkdir -p data
          URL='https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003687312&fileDetailSn=1'
          TMP_FILE="$(mktemp)"
          if curl --fail --location --connect-timeout 10 --max-time 35 --retry 1 "$URL" --output "$TMP_FILE" && [ "$(wc -c < "$TMP_FILE")" -gt 100000 ]; then
            if head -c 300 "$TMP_FILE" | grep -Eiq '<!doctype html|<html|<error|<?xml'; then
              rm -f "$TMP_FILE"
              echo "::warning::Region download returned markup instead of a CSV; preserving cached official data."
            else
              mv "$TMP_FILE" data/official_legal_dong.csv
            fi
          else
            rm -f "$TMP_FILE"
            echo "::warning::Official region download unavailable; keeping existing verified pages and homepage."
          fi
          if [ -f data/official_legal_dong.csv ] && [ "$(wc -c < data/official_legal_dong.csv)" -gt 100000 ]; then
            if python tools/import_official_regions.py; then
              echo "Official nationwide region data imported successfully."
            else
              echo "::warning::Official region import failed validation; retaining existing region data and continuing deployment."
            fi
          else
            echo "::warning::Skipping region import because official CSV is unavailable."
          fi
      - name: Report region import coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/regions.json').read_text(encoding='utf-8'))
          regions = data.get('regions', [])
          provinces = {r.get('slug', '').split('/')[0] for r in regions if r.get('slug')}
          print(f"Region records: {len(regions)}; province groups: {len(provinces)}")
          if len(regions) < 1000 or len(provinces) < 15:
              print("::warning::Nationwide region generation is NOT complete. Deploying the verified pilot only.")
          else:
              print("Official region coverage threshold met; site build and sitemap validation still required.")
          PY
      - name: Generate 100,000 SEO keyword targets
        run: python tools/generate_seo_keywords.py
      - name: Generate regional pages if verified region data exists
        shell: bash
        run: |
          if [ -f data/regions.json ]; then
            python tools/generate_pages.py
          else
            echo "::warning::No verified region data; preserving committed homepage and service pages."
          fi
      - name: Configure canonical URLs and custom-domain artifact
        run: python tools/configure_site.py
      - name: Audit duplicate titles and low-information region pages
        run: python tools/audit_seo_quality.py
      - name: Validate generated pages when sitemap exists
        shell: bash
        run: |
          test -f index.html || exit 1
          python tools/validate_site.py
      - name: Verify region expansion and key landing pages before publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in ['index.html', 'region/index.html', 'region/gangneung-taksong/index.html', 'assets/regions/gangneung-taksong-card.svg', 'assets/smart24-business-card.svg', 'CNAME']:
              if not Path(path).is_file():
                  raise SystemExit('Missing required deployment file: ' + path)
          assert Path('CNAME').read_text().strip() == 'jeongukdaeri.kr'
          root = ET.parse('sitemap.xml').getroot()
          assert root.tag.endswith('sitemapindex') or root.tag.endswith('urlset')
          print('PASS: custom domain, regional landing page, business card, sitemap')
          PY
      - name: Check generated page count and sitemap coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          regions=json.loads(Path('data/regions.json').read_text(encoding='utf-8')).get('regions',[])
          pages=sum(1 for _ in Path('region').rglob('index.html'))
          root=ET.parse('sitemap.xml').getroot()
          maps=[e.text for e in root.iter() if e.tag.endswith('loc') and e.text]
          print(f'Region records: {len(regions)}; generated region pages: {pages}; sitemap references: {len(maps)}')
          if pages < len(regions):
              raise SystemExit('Region page coverage lower than source data; refusing incomplete deployment')
          if len(regions) < 1000:
              print('::warning::Nationwide official legal-dong import incomplete; regional coverage is partial')
          PY
      - name: Audit nationwide generation before deploy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import xml.etree.ElementTree as ET
          data=json.loads(Path('data/regions.json').read_text(encoding='utf-8'))
          regions=data.get('regions', [])
          slugs=[r['slug'].strip('/') for r in regions]
          if len(slugs)!=len(set(slugs)):
              raise SystemExit('Duplicate region slugs')
          if not regions:
              raise SystemExit('No regions found')
          missing=[slug for slug in slugs if not (Path('region')/slug/'index.html').exists()]
          if missing:
              raise SystemExit('Missing region pages: '+', '.join(missing[:10]))
          provinces={slug.split('/')[0] for slug in slugs}
          sitemap_files=sorted(Path('.').glob('sitemap-*.xml'))
          indexed=set()
          for sitemap in sitemap_files:
              for el in ET.parse(sitemap).iter():
                  if el.tag.endswith('loc') and el.text:
                      indexed.add(unquote(urlsplit(el.text).path).rstrip('/')+'/')
          unindexed=[slug for slug in slugs if '/region/'+slug+'/' not in indexed]
          if unindexed:
              raise SystemExit('Region pages absent from sitemaps: '+', '.join(unindexed[:10]))
          report={'region_records':len(regions),'province_groups':len(provinces),'region_pages_checked':len(slugs),'sitemap_files':len(sitemap_files),'source':data.get('source','partial local dataset'),'full_official_coverage':bool(data.get('source')) and len(regions)>=1000 and len(provinces)>=15}
          Path('deployment-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          if not report['full_official_coverage']:
              print('::warning::This build is NOT complete nationwide official legal-dong coverage')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify GitHub Pages deployment result (not Cloudtype)
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"
          echo "GitHub Pages deployed to: $PAGES_URL"
          # The live custom domain may be served by Cloudtype instead.
          # Do not fail a successful GitHub Pages deployment on Cloudtype routing.
          echo "PASS: GitHub Pages deployment action succeeded; Cloudtype checks are separate."
