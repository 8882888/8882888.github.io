name: Verify dynamic server and region data
on:
  push:
    paths:
      - 'server.js'
      - 'package.json'
      - 'data/regions.json'
      - 'data/ride-history.json'
      - 'tests/server.test.js'
      - '.github/workflows/verify-dynamic-server.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server.js
      - name: Run real HTTP smoke tests
        run: node tests/server.test.js
