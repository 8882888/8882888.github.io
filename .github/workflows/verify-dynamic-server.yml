name: Verify dynamic server and region data
on:
  push:
    paths:
      - 'server.js'
      - 'lib/**/*.js'
      - 'package.json'
      - 'data/regions.json'
      - 'data/ride-history.json'
      - 'tests/server.test.js'
      - 'tests/traffic-analytics.test.js'
      - 'assets/traffic-analytics.js'
      - 'index.html'
      - '.github/workflows/verify-dynamic-server.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server.js
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify phone conversion and referral expansion without real clicks
        run: node tests/traffic-analytics.test.js
      - name: Run real HTTP smoke tests
        run: node tests/server.test.js
