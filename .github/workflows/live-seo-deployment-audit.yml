name: Verify live Cloudtype SEO deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy to Cloudtype]
    types: [completed]
    branches: [main]
  schedule:
    # 09:20 Korea Standard Time, daily
    - cron: '20 0 * * *'

permissions:
  contents: read

concurrency:
  group: live-seo-deployment-audit
  cancel-in-progress: true

jobs:
  audit-production:
    name: Compare production SEO with GitHub
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact revision verified by deployment
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check production SEO audit
        run: python -m py_compile tools/audit_live_seo.py tools/audit_live_1000.py
      - name: Check actual public website, sitemap and SEO freshness
        run: python tools/audit_live_seo.py
      - name: Audit 100 live localities and separate service images
        run: python tools/audit_live_100_regional_cards.py
      - name: Preserve 100-check failure details and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-live-locality-100
          path: /tmp/smart24-live-locality-100.json
          if-no-files-found: warn
      - name: Audit 50 priority SEO and mobile image pages
        run: python tools/audit_live_seo_mobile_50.py
      - name: Preserve 50-page SEO and mobile audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-live-seo-mobile-50
          path: /tmp/smart24-live-seo-mobile-50.json
          if-no-files-found: warn
      - name: Audit 1000 live locality SEO pages and actual WebP cards
        run: python tools/audit_live_1000.py
      - name: Store 1000-point production audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-live-seo-mobile-1000
          path: /tmp/smart24-live-1000.json
          if-no-files-found: error
      - name: Measure 20 live HTML mobile transfer sizes
        run: python tools/audit_live_html_compression.py
      - name: Save 20-route gzip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-live-mobile-gzip-20
          path: /tmp/smart24-live-gzip-20.json
          if-no-files-found: warn
