name: Verify official Cloudtype release matches GitHub main

on:
  workflow_run:
    workflows: [Deploy to Cloudtype]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 09:10 KST independent production drift check
    - cron: '10 0 * * *'

permissions:
  contents: read

concurrency:
  group: smart24-cloudtype-release-check
  cancel-in-progress: true

jobs:
  verify-cloudtype:
    name: Compare deployed server, homepage and SEO guide count
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Report automatic deploy status and independently verify manual releases
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then
            echo "::warning::Cloudtype automatic deployment did not succeed ($DEPLOY_CONCLUSION). Comparing the actual live release anyway; the owner may have manually deployed."
            echo "Automatic deployment: $DEPLOY_CONCLUSION. The next step checks the real production release hash independently and must pass before any up-to-date claim." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the exact commit attempted by Cloudtype
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 90
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the REAL Cloudtype server (not the Pages backup)
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
          DEPLOY_CHECK_ATTEMPTS: '4'
        run: node tools/check_cloudtype_freshness.js
      - name: Verify live service-center robots, canonical, sitemap and structured data
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        run: node scripts/audit-live-service-center-schema.mjs
      - name: Verify live Naver-priority title, H1, descriptions and source-first content
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        run: node scripts/audit-live-priority-ctr-evidence.cjs
      - name: Verify live archive-backed regional discovery on current Cloudtype release
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        shell: bash
        run: |
          # workflow_run tests the EXACT deploy commit, which can be older than
          # the current workflow definition in main. Do not execute a future
          # auditor that does not exist at the deployed source revision.
          if [ -f scripts/audit-live-archive-discovery.cjs ]; then
            node scripts/audit-live-archive-discovery.cjs
          else
            echo "::notice::Archive link audit is not part of deployed revision $(git rev-parse --short HEAD); NOT VERIFIED, no pass claimed."
            echo "Archived regional link audit: NOT VERIFIED (auditor absent in deployed source revision $(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify live six archive-backed guides and exact thirteen source links
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        shell: bash
        run: |
          # workflow_run checks the exact deployed revision, not the future main.
          if [ -f scripts/audit-live-six-local-source-guides.cjs ]; then
            node scripts/audit-live-six-local-source-guides.cjs
          else
            echo "::notice::Six-source live auditor absent from deployed SHA; NOT VERIFIED."
            echo "Six-source live HTML audit: NOT VERIFIED (auditor not in checked-out deploy SHA)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify second six original-backed regional pages on the real release
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        shell: bash
        run: |
          # The exact deployed SHA must contain the auditor; older releases do not.
          if [ -f scripts/audit-live-second-six-source-guides.cjs ]; then
            node scripts/audit-live-second-six-source-guides.cjs
          else
            echo "::notice::Second six audit not part of deployed SHA; NOT VERIFIED."
            echo "Second six original guides: NOT VERIFIED (auditor absent in deployed revision)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify deployed B2B business-specific work stages and source links
        shell: bash
        env:
          PRODUCTION_URL: https://jeongukdaeri.kr
        run: |
          if [ -f scripts/audit-live-business-evidence-workflows-20261117.cjs ]; then
            node scripts/audit-live-business-evidence-workflows-20261117.cjs
          else
            echo "::notice::Business evidence auditor not in deployed SHA: NOT VERIFIED."
            echo "Business evidence live audit: NOT VERIFIED (auditor not in deployed SHA)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify two transport-intent pages in live Cloudtype HTML after release match
        shell: bash
        env:
          PRODUCTION_URL: https://jeongukdaeri.kr
        run: |
          if [ -f scripts/audit-live-taksong-ctr-intent-20261117.cjs ]; then
            node scripts/audit-live-taksong-ctr-intent-20261117.cjs
          else
            echo "::notice::This release predates transport-intent auditor; NOT VERIFIED."
            echo "Transport-intent HTTP audit: NOT VERIFIED (no auditor in deployed SHA)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Identify the previous Cloudtype release when freshness fails
        if: failure()
        continue-on-error: true
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        run: node tools/identify-cloudtype-release.js
