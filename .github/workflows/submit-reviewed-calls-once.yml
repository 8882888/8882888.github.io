name: Verify and submit newly published anonymized reviews to Naver IndexNow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-reviewed-calls-once.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart24-verified-review-indexnow-once
  cancel-in-progress: false
jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verified published sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test strict canonical and changed-URL targeting
        run: node tests/indexnow-targeting.test.js
      - name: Verify real HTTP pages then notify Naver (no Google IndexNow)
        env:
          INDEXNOW_CHANGED_FILES: ''
          INDEXNOW_URLS: >-
            https://jeongukdaeri.kr/reviews/completed-calls-20261114/
            https://jeongukdaeri.kr/reviews/integrated-20261114/
        run: node scripts/indexnow-notify.js
