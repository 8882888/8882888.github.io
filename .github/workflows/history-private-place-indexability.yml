name: Validate privacy-preserving historical ride search discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server.js'
      - 'tests/history-private-place-indexability.test.cjs'
      - '.github/workflows/history-private-place-indexability.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'tests/history-private-place-indexability.test.cjs'
      - '.github/workflows/history-private-place-indexability.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --check server.js
      - run: node --test tests/history-private-place-indexability.test.cjs
      - run: npm run check:seo
