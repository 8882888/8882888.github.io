name: Audit live browser auto-expanding keyword cards
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_live_browser_cards.cjs'
      - 'tools/audit_live_home_mobile.cjs'
      - 'index.html'
      - 'assets/region-card-preview.js'
      - 'lib/exact-keyword-card.js'
      - 'server.js'
      - 'assets/cycling-routes/*.svg'
      - '.github/workflows/live-browser-card-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full-resolution dimensions on all seven cycling cards
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const files=fs.readdirSync('assets/cycling-routes').filter(x=>x.endsWith('.svg'));
          assert.equal(files.length,7,'expected seven cycling-route posters');
          for(const name of files){
            const svg=fs.readFileSync('assets/cycling-routes/'+name,'utf8');
            assert.match(svg,/<svg[^>]*width="1200"[^>]*height="630"[^>]*viewBox="0 0 1200 630"/,'missing intrinsic size '+name);
            assert.match(svg,/<title[^>]*>[^<]+<\/title>/,'accessible title '+name);
          }
          console.log('PASS cycling seven intrinsic 1200×630 SVG image dimensions');
          NODE
      - name: Confirm updated cycling image is published on Cloudtype before browser audit
        run: |
          python3 - <<'PY'
          import time,urllib.request
          url='https://jeongukdaeri.kr/assets/cycling-routes/yeongsan-taksong.svg?dimension-probe=20261104'
          for attempt in range(24):
              try:
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SVG-Dimensions/1.0'})
                  with urllib.request.urlopen(request,timeout=12) as response:
                      svg=response.read(400).decode('utf-8')
                      if 'width="1200" height="630" viewBox="0 0 1200 630"' in svg:
                          print('PASS: latest Cloudtype cycling SVG contains intrinsic full-resolution dimensions')
                          break
              except Exception as error:
                  print('Cloudtype image check:',str(error))
              if attempt==23: raise SystemExit('Cycling SVG on public site is still stale after deployment')
              time.sleep(5)
          PY
      - name: Confirm exact keyword image API is deployed on the public site
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          u='https://jeongukdaeri.kr/api/region-card-preview?q=%EB%B6%80%EC%82%B0%ED%83%81%EC%86%A1%ED%9A%8C%EC%82%AC'
          for n in range(30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache'}),timeout=15) as r:
                      d=json.load(r)
                      c=(d.get('cards') or [{}])[0]
                      if c.get('displayKeyword')=='부산탁송회사' and '/keyword-card/exact/' in c.get('keywordImage',''):
                          print('PASS exact production keyword image deployed')
                          break
              except Exception as exc: print('still deploying',str(exc))
              if n==29: raise SystemExit('The live API still uses older generic keyword images')
              time.sleep(6)
          PY
      - name: Install isolated browser test tooling
        run: |
          mkdir -p /tmp/smart24-browser-tooling
          cd /tmp/smart24-browser-tooling
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test live typing, image rendering, mobile responsiveness, and zoom
        env:
          NODE_PATH: /tmp/smart24-browser-tooling/node_modules
          SMART24_AUDIT_BASE: https://jeongukdaeri.kr
        run: node tools/audit_live_browser_cards.cjs
      - name: Audit first-screen mobile performance and scroll-triggered ride records
        env:
          NODE_PATH: /tmp/smart24-browser-tooling/node_modules
          SMART24_AUDIT_BASE: https://jeongukdaeri.kr
        run: node tools/audit_live_home_mobile.cjs
      - name: Upload browser screenshots and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-live-browser-keyword-cards
          path: artifacts/live-browser-cards/
          if-no-files-found: warn
          retention-days: 14
