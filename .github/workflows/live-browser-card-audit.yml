name: Audit live browser auto-expanding keyword cards
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_live_browser_cards.cjs'
      - '.github/workflows/live-browser-card-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tooling
        run: |
          mkdir -p /tmp/smart24-browser-tooling
          cd /tmp/smart24-browser-tooling
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test live typing, image rendering, mobile responsiveness, and zoom
        env:
          NODE_PATH: /tmp/smart24-browser-tooling/node_modules
          SMART24_AUDIT_BASE: https://jeongukdaeri.kr
        run: node tools/audit_live_browser_cards.cjs
      - name: Upload browser screenshots and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-live-browser-keyword-cards
          path: artifacts/live-browser-cards/
          if-no-files-found: warn
          retention-days: 14
