name: Priority originals and concise Naver regional SEO
on:
  pull_request:
    paths:
      - 'server.js'
      - 'data/naver-regional-focus-nineteenth-daeri-100.json'
      - 'data/naver-regional-focus-nineteenth-taksong-100.json'
      - 'tests/sejong-handover-evidence-guidance-20261121.test.cjs'
      - 'data/naver-regional-focus-sixteenth-daeri-100.json'
      - 'data/naver-regional-focus-sixteenth-taksong-100.json'
      - 'data/naver-regional-focus-twentieth-daeri-100.json'
      - 'data/naver-regional-focus-twentieth-taksong-100.json'
      - 'tests/sejong-wonju-local-guidance-20261121.test.cjs'
      - 'data/priority-search-questions-20261116.json'
      - 'tests/priority-search-questions-20261116.test.cjs'
      - 'data/seo-reviewed-local-originals-20261116.json'
      - 'data/seo-pages.json'
      - 'data/naver-priority-meta-80-20261116.json'
      - 'tests/naver-priority-meta-80-20261116.test.cjs'
      - 'tests/priority-originals-unique-seo-20261116.test.cjs'
      - '.github/workflows/priority-originals-unique-seo.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'data/naver-regional-focus-nineteenth-daeri-100.json'
      - 'data/naver-regional-focus-nineteenth-taksong-100.json'
      - 'tests/sejong-handover-evidence-guidance-20261121.test.cjs'
      - 'data/naver-regional-focus-sixteenth-daeri-100.json'
      - 'data/naver-regional-focus-sixteenth-taksong-100.json'
      - 'data/naver-regional-focus-twentieth-daeri-100.json'
      - 'data/naver-regional-focus-twentieth-taksong-100.json'
      - 'tests/sejong-wonju-local-guidance-20261121.test.cjs'
      - 'data/seo-reviewed-local-originals-20261116.json'
      - 'data/seo-pages.json'
      - 'data/naver-priority-meta-80-20261116.json'
      - 'tests/naver-priority-meta-80-20261116.test.cjs'
      - 'tests/priority-originals-unique-seo-20261116.test.cjs'
      - '.github/workflows/priority-originals-unique-seo.yml'
permissions:
  contents: read
jobs:
  unique-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --omit=dev --no-fund --no-audit
      - name: Validate seven unique search question guides on canonical service pages
        run: node --test tests/priority-search-questions-20261116.test.cjs
      - name: Validate 23 priority Naver short meta and Open Graph descriptions
        run: node --test tests/naver-priority-meta-80-20261116.test.cjs
      - name: Validate business metadata and previously exposed Jegi-dong discovery
        run: |
          node --test tests/business-indexability-content.test.mjs
          node --test tests/seo-sitemap-regression.test.js
          node --test tests/business-sitemap-runtime-20261117.test.cjs
      - name: Validate four evidence-safe Sejong pickup and handover guides
        run: node --test tests/sejong-handover-evidence-guidance-20261121.test.cjs
      - name: Validate six source-safe Sejong and Wonju practical local guides
        run: node --test tests/sejong-wonju-local-guidance-20261121.test.cjs
      - name: Validate seven target pages and citywide source disclaimers
        run: |
          node --check server.js
          node --check tests/priority-originals-unique-seo-20261116.test.cjs
          node --test tests/priority-originals-unique-seo-20261116.test.cjs

  production-proof:
    if: github.event_name == 'push'
    needs: unique-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check seven live originals and hub scope after Cloudtype release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            echo "Official URL original-source verification $attempt/24"
            if SMART24_AUDIT_LIVE=1 node --test tests/priority-originals-unique-seo-20261116.test.cjs; then
              echo "### PASS source-linked priority pages match production" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          echo "::error::Live Naver original-source pages were not verified on Cloudtype"
          exit 1
      - name: Verify 23 deployed Naver short metadata and canonical URLs after Cloudtype rollout
        shell: bash
        env:
          SMART24_META_LIVE: '1'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Naver 80-character live metadata check (Cloudtype rollout) $attempt/30"
            if node --test tests/naver-priority-meta-80-20261116.test.cjs; then
              echo "### PASS 23 production HTML metadata and canonical URLs" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done
          echo "::error::23 production Naver metadata URLs did not match latest source"
          exit 1
