name: Evidence-first national review of all 2,900 regional guides

on:
  pull_request:
    paths:
      - 'scripts/ai-index-quality-triage.mjs'
      - 'scripts/audit-national-template-reuse-20261121.mjs'
      - 'tests/evidence-first-2571-triage.test.cjs'
      - 'tests/nationwide-evidence-coverage-20261121.test.cjs'
      - 'tests/nationwide-locality-template-audit-20261121.test.cjs'
      - 'tests/national-32-existing-local-guide-details-20261121.test.cjs'
      - 'tests/nationwide-batch2-32-unique-local-guides-20261121.test.cjs'
      - 'tests/nationwide-runtime-source-parity-20261121.test.cjs'
      - 'server.js'
      - 'data/legal-regions/**'
      - '.github/workflows/ai-editorial-evidence-triage.yml'
      - 'data/seo-reviewed-local-originals-20261116.json'
      - 'data/priority-regions.json'
      - 'data/naver-regional-focus-*.json'
      - 'blog/posts.json'
  push:
    branches: [main]
    paths:
      - 'scripts/ai-index-quality-triage.mjs'
      - 'scripts/audit-national-template-reuse-20261121.mjs'
      - 'tests/evidence-first-2571-triage.test.cjs'
      - 'tests/nationwide-evidence-coverage-20261121.test.cjs'
      - 'tests/nationwide-locality-template-audit-20261121.test.cjs'
      - 'tests/national-32-existing-local-guide-details-20261121.test.cjs'
      - 'tests/nationwide-batch2-32-unique-local-guides-20261121.test.cjs'
      - 'tests/nationwide-runtime-source-parity-20261121.test.cjs'
      - 'server.js'
      - 'data/legal-regions/**'
      - '.github/workflows/ai-editorial-evidence-triage.yml'
      - 'data/seo-reviewed-local-originals-20261116.json'
      - 'data/priority-regions.json'
      - 'data/naver-regional-focus-*.json'
      - 'blog/posts.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all 2900 region/service editorial records
        run: |
          node --check scripts/ai-index-quality-triage.mjs
          node scripts/ai-index-quality-triage.mjs
      - name: Audit locality-name-substitution templates across 2900 original guides
        run: |
          node --check scripts/audit-national-template-reuse-20261121.mjs
          node scripts/audit-national-template-reuse-20261121.mjs
          node --test tests/nationwide-locality-template-audit-20261121.test.cjs
      - name: Check grounded source tiers and absence of fabricated indexing
        run: node --test tests/evidence-first-2571-triage.test.cjs
      - name: Verify all 33 original source batches reach the live nationwide SSR
        run: node --test tests/nationwide-runtime-source-parity-20261121.test.cjs
      - name: Preserve and validate 32 locality-specific edits across 17 province registry
        run: node --test tests/national-32-existing-local-guide-details-20261121.test.cjs
      - name: Verify second nationwide round removes generic text without changing source identity
        run: node --test tests/nationwide-batch2-32-unique-local-guides-20261121.test.cjs
      - name: Prove full 17-province, both-service, no-truncation nationwide review
        run: node --test tests/nationwide-evidence-coverage-20261121.test.cjs
      - name: Publish editorial review queue, NOT Naver index statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-first-region-review-2571
          path: |
            ai-index-quality-review.json
            ai-index-quality-review.csv
            ai-index-quality-review.md
            ai-index-evidence-priority.json
            ai-index-evidence-priority.csv
            ai-index-nationwide-coverage.json
            ai-index-nationwide-coverage.md
            ai-index-nationwide-queue.csv
            ai-index-template-reuse.json
            ai-index-template-reuse.md
            ai-index-template-reuse-queue.csv
          if-no-files-found: warn
          retention-days: 30
