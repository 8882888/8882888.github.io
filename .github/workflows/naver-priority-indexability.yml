name: Check Naver priority crawlability and 8 sitemaps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "index.html"
      - "robots.txt"
      - "sitemap*.xml"
      - "business/**"
      - "daeri/**"
      - "taksong/**"
      # Changes to regional guidance must refresh the human review queue.
      - "data/naver-regional-focus-*.json"
      - "data/priority-regions.json"
      - "tests/priority-regions-quality.test.mjs"
      - "data/legal-regions/**"
      - "lib/nationwide-locality-explorer.js"
      - "scripts/ai-index-quality-triage.mjs"
      - "scripts/audit-live-structured-data.mjs"
      - "scripts/report-naver-official-scorecard.mjs"
      - "tests/naver-official-scorecard.test.mjs"
      - "data/naver-searchadvisor-official-baseline.json"
      - "scripts/audit-naver-priority-live.mjs"
      - "scripts/indexability-scope.mjs"
      - "tests/indexability-scope.test.mjs"
      - ".github/workflows/naver-priority-indexability.yml"
  workflow_run:
    workflows: ["Deploy to Cloudtype"]
    types: [completed]
    branches: [main]
  schedule:
    # Daily 09:45 Asia/Seoul; audit works even when auto deployment is blocked.
    - cron: "45 0 * * *"
permissions:
  contents: read
concurrency:
  group: smart24-naver-priority-live
  cancel-in-progress: false
jobs:
  read-only-audit:
    # Inspect the REAL live site even after a failed deploy. Otherwise drift
    # is exactly when the indexability audit would have been skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current source for comparison with live release
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Naver crawler rules and read-only auditor syntax
        run: |
          node --test tests/indexability-scope.test.mjs
          node --test tests/priority-regions-quality.test.mjs
          node --check scripts/audit-naver-priority-live.mjs
      - name: Check live HTTP, 8 sitemaps, 17 provinces and canonical
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        run: node scripts/audit-naver-priority-live.mjs
      - name: Rank duplicate and thin local guidance for human AI editorial review
        if: always()
        run: |
          node --check scripts/ai-index-quality-triage.mjs
          node scripts/ai-index-quality-triage.mjs
      - name: Verify schema.org JSON-LD in actual production HTML
        run: node scripts/audit-live-structured-data.mjs
      - name: Generate official Naver baseline-vs-current scorecard (no fabricated counts)
        if: always()
        run: |
          node --test tests/naver-official-scorecard.test.mjs
          node scripts/report-naver-official-scorecard.mjs
      - name: Save report for Naver Search Advisor comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-naver-priority-crawl-audit
          retention-days: 30
          path: |
            seo-priority-live-report.json
            seo-priority-live-report.csv
            seo-priority-live-report.md
            ai-index-quality-review.json
            ai-index-quality-review.csv
            ai-index-quality-review.md
            naver-official-scorecard.json
            naver-official-scorecard.md
            structured-data-live-report.json
            structured-data-live-report.md
          if-no-files-found: error
