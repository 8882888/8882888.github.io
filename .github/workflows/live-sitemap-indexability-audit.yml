name: Live sitemap technical indexability audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-sitemap-indexability-audit.yml'
  # Full production crawl is expensive on the existing 512 MB server.
  # Daily/manual runs retain exhaustive checks without concurrent release fan-out.
  # The existing post-deploy priority crawl and release verification stay enabled.
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: live-sitemap-indexability
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository at release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test sitemap audit classification against local fixtures
        run: node --test tests/live-sitemap-indexability-audit.test.mjs
      - name: Verify Cloudtype running source against exact checkout
        id: release
        continue-on-error: true
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
          DEPLOY_CHECK_ATTEMPTS: '3'
        run: node tools/check_cloudtype_freshness.js
      - name: Crawl sitemap URLs and save per-URL technical findings
        id: audit
        continue-on-error: true
        env:
          SEO_AUDIT_ORIGIN: https://jeongukdaeri.kr
          SEO_AUDIT_CONCURRENCY: '1'
          SEO_AUDIT_PAUSE_MS: '650'
          SEO_AUDIT_REPORT_DIR: reports
        run: node scripts/audit-live-sitemap-indexability-20261121.mjs
      - name: Write summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/live-sitemap-indexability.json ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const {summary, errors, generatedAt} = JSON.parse(fs.readFileSync('reports/live-sitemap-indexability.json', 'utf8'));
          const lines = [
            '# Live sitemap technical indexability',
            '',
            'This audit does not represent actual Naver indexing or ranking.',
            '',
            '- Generated: ' + generatedAt,
            '- Release verification: ${{ steps.release.outcome }}',
            '- Unique sitemap URLs: ' + summary.uniqueUrls,
            '- Technically eligible: ' + summary.technicallyEligible,
            '- Technical blockers (review): ' + summary.needsReview,
            '- Priority sitemap URLs: ' + (summary.prioritySitemapUrls ?? 'unknown'),
            '- Priority sitemap blockers: ' + (summary.prioritySitemapBlockers ?? 'unknown'),
            '- Quality warnings (pages): ' + summary.warningPages,
            '- Sitemap fetch/XML errors: ' + errors.length,
            '- Crawl completeness: ' + summary.completeness,
            '',
            '## Technical blocker counts',
            ...Object.entries(summary.reasonCounts).sort((a,b) => b[1]-a[1]).map(([reason,count]) => '- ' + reason + ': ' + count),
            '',
            '## Priority sitemap blockers (top 50)',
            ...((summary.prioritySitemapBlockingUrls || []).map(row => '- ' + row.url + ': ' + row.reasons.join(', '))),
            '',
            '## Quality warning counts',
            ...Object.entries(summary.warningCounts || {}).sort((a,b) => b[1]-a[1]).map(([reason,count]) => '- ' + reason + ': ' + count),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
          else
            echo 'Audit report missing: inspect crawler job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload technical audit JSON and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sitemap-indexability
          path: |
            reports/live-sitemap-indexability.json
            reports/live-sitemap-indexability.csv
            reports/live-sitemap-indexability-progress.json
          if-no-files-found: warn
          retention-days: 30
      - name: Mark release mismatch or crawler failures
        if: steps.release.outcome == 'failure' || steps.audit.outcome == 'failure'
        run: exit 1
