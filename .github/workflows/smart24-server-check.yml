name: Smart24 server checks
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'Dockerfile'
      - 'index.html'
      - 'data/**'
      - '.github/workflows/smart24-server-check.yml'
  workflow_dispatch:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server.js
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify nationwide dynamic routes
        run: node tests/server.test.js
      - name: Start and smoke-test HTTP service
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 node server.js > /tmp/smart24-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/smart24-health.json; then break; fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:3000/health
          curl --fail --show-error --output /dev/null http://127.0.0.1:3000/
          curl --fail --show-error --output /dev/null http://127.0.0.1:3000/robots.txt
          curl --fail --show-error --output /tmp/smart24-sitemap.xml http://127.0.0.1:3000/sitemap.xml
          curl --fail --show-error --output /tmp/smart24-home.html http://127.0.0.1:3000/
          curl --fail --show-error --output /tmp/smart24-seoul.html http://127.0.0.1:3000/daeri/seoul/
          grep -q 'tel:18114294' /tmp/smart24-home.html
          grep -q 'tel:18114294' /tmp/smart24-seoul.html
          png_path=$(node -e "const s=require('fs').readFileSync('/tmp/smart24-sitemap.xml','utf8');const m=s.match(/\\/card\\/area-[0-9]+(?:-light|-art(?:-v2)?|-inline(?:-v2)?)?\\.png/);if(!m)process.exit(1);process.stdout.write(m[0])")
          test -n "$png_path"
          curl --fail --show-error --output /tmp/smart24-region.png "http://127.0.0.1:3000$png_path" || { cat /tmp/smart24-server.log; exit 1; }
          file /tmp/smart24-region.png | grep -q 'PNG image data'
          grep -q 'og:image' /tmp/smart24-seoul.html
          # Ensure major local service pages are discoverable in their sitemap.
          curl --fail --show-error --output /tmp/smart24-taksong-sitemap.xml http://127.0.0.1:3000/sitemap-taksong.xml
          grep -q '/taksong/' /tmp/smart24-taksong-sitemap.xml
          grep -q 'rel="canonical"' /tmp/smart24-seoul.html
          # Verify a paginated keyword directory links to real regional destinations.
          curl --fail --show-error --output /tmp/smart24-keywords.html 'http://127.0.0.1:3000/keywords/taksong/?page=2'
          grep -q 'href="/taksong/' /tmp/smart24-keywords.html
          grep -q '/keywords/taksong/?page=2' /tmp/smart24-keywords.html
          # Check the first dynamic region page and its clickable PNG card.
          region_path=$(node -e "const s=require('fs').readFileSync('/tmp/smart24-sitemap.xml','utf8');const m=s.match(/\\/region\\/area-[0-9]+\\//);if(!m)process.exit(1);process.stdout.write(m[0])")
          test -n "$region_path"
          curl --fail --show-error --output /tmp/smart24-region.html "http://127.0.0.1:3000$region_path"
          grep -q 'href="tel:18114294"' /tmp/smart24-region.html
          grep -q 'encodingFormat":"image/png"' /tmp/smart24-region.html
          grep -q '/card/area-' /tmp/smart24-region.html
          # Public ride history must not expose departure times or privacy placeholder labels.
          curl --fail --show-error --output /tmp/smart24-rides.json http://127.0.0.1:3000/api/public-rides
          node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/smart24-rides.json','utf8'));if(!Array.isArray(rows)||rows.some(r=>('time' in r)||('departure_time' in r)))process.exit(1)"
          if grep -Eq '시간 비공개|시간 미공개|출발 시간' /tmp/smart24-home.html; then echo 'Public homepage leaks time labels'; exit 1; fi
          echo 'Smart24 local HTTP smoke checks passed'
