name: Smart24 server checks
on:
  push:
    branches: [main]
    paths:
      - 'assets/road-fare.js'
      - 'assets/jeju*'
      - 'fare/**'
      - 'lib/**'
      - 'tests/**'
      - 'route-taksong/courses/**'
      - 'special/cycling-trail-transport/**'
      - 'assets/cycling-routes/**'
      - 'scripts/**'
      - 'server.js'
      - 'package.json'
      - 'Dockerfile'
      - 'index.html'
      - 'data/**'
      - '.github/workflows/smart24-server-check.yml'
  workflow_dispatch:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server.js
          node tests/cycling-centers.test.js
      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify Naver notification targets and prevent duplicate URL floods
        run: node tests/indexnow-targeting.test.js
      - name: Check thirty regional blog posts have thirty unique local hashtags
        run: node tests/blog-regional-hashtags.test.js
      - name: Validate ten source-backed regional taksong guides
        run: node tests/regional-originals.test.js
      - name: Validate second 20 nationwide designated-driver SEO targets
        run: node tests/nationwide-daeri-batch-20.test.js
      - name: Validate first 20 nationwide search visibility targets
        run: node tests/nationwide-search-batch-20.test.js
      - name: Verify nationwide 17-province search discoverability
        run: node tests/nationwide-17-provinces-visibility.test.js
      - name: Verify five priority customer journeys and factual ride filters
        run: node tests/five-priorities-customer-journey.test.js
      - name: Verify quote-first review-to-booking conversion
        run: node tests/quote-review-booking-first.test.js
      - name: Verify five driver-cost and transport-quote search intents
        run: node tests/fare-search-intent-keywords.test.js
      - name: Verify nationwide 17 province and 20562 locality dynamic mobile quote links
        run: node tests/nationwide-dynamic-mobile-regions.test.js
      - name: Verify road and ferry quote calculations
        run: node tests/fare-rules.test.js
      - name: Verify phone conversion tracking and referral toggles (no live DB writes)
        run: node tests/traffic-analytics.test.js
      - name: Check metropolitan and same-name city ride attribution
        run: node tests/regional-history-ambiguity.test.js
      - name: Verify 63 regional blog keyword suffixes and non-duplicated article guidance
        run: node tests/regional-blog-keywords.test.js
      - name: Validate 1,000 customer journey quality gates across 50 regional targets
        run: node tests/competitive-conversion-1000.test.js
      - name: Verify user priority 25 locality keywords
        run: node tests/blog-priority-25.test.js
      - name: Verify 100 new regional keywords across 20 canonical blog guides
        run: node tests/blog-work-100.test.js
      - name: Verify exact keyword artwork for 20 priority phrases
        run: node tests/exact-keyword-card.test.js
      - name: Validate 50 localized SEO guides and avoid duplicate or fabricated data
        run: node tests/naver-regional-focus-50.test.js
      - name: Validate next 50 SEO guides, no overlap with existing 50
        run: node tests/naver-regional-focus-next-50.test.js
      - name: Validate third 50 SEO guides and booking-specific regional value
        run: node tests/naver-regional-focus-third-50.test.js
      - name: Verify next 200 unique regional SEO and image targets
        run: node tests/naver-regional-focus-twenty-first-200.test.js
      - name: Protect source-backed national homepage authority and single-step booking
        run: node tests/national-authority-homepage.test.js
      - name: Protect homepage image, booking actions, fares, dynamic cards and 2,591 rides
        run: node tests/homepage-conversion-regression.test.js
      - name: Validate all 2,591 historical ride links and quote paths
        run: node tests/review-archive-link-integrity-2591.test.js
      - name: Verify 300 unresolved ride records against legal regions
        run: node tests/unresolved-review-audit-300.test.js
      - name: Verify nationwide dynamic routes
        run: node tests/server.test.js
      - name: Verify 500 nationwide five-service review routes
        run: node tests/review-first-500-services.test.js
      - name: Verify 102810 nationwide service review routes
        run: node tests/nationwide-review-first-102810.test.js
      - name: Verify Ganghwa canonical search recovery with true rides
        run: node tests/ganghwa-daeri-search-recovery.test.js
      - name: Verify nationwide million-choice search and preserved rides
        run: node tests/service-finder-million.test.js
      - name: Ensure curated service and mountain guide preservation
        run: python3 tests/static-generator-preservation.test.py
      - name: Verify scheduled archive rebuild preserves all factual source sections
        run: |
          python3 scripts/build_ride_record_stories.py
          python3 scripts/check_core_content.py
      - name: Start and smoke-test HTTP service
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 node server.js > /tmp/smart24-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/smart24-health.json; then break; fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:3000/health
          curl --fail --show-error --output /dev/null http://127.0.0.1:3000/
          curl --fail --show-error --output /dev/null http://127.0.0.1:3000/robots.txt
          curl --fail --show-error --dump-header /tmp/smart24-favicon.headers --output /tmp/smart24-favicon.bin http://127.0.0.1:3000/favicon.ico
          python3 - <<'PYICON'
          from pathlib import Path
          data=Path('/tmp/smart24-favicon.bin').read_bytes()
          headers=Path('/tmp/smart24-favicon.headers').read_text().lower()
          is_png=data.startswith(bytes.fromhex('89504e470d0a1a0a'))
          is_ico=data.startswith(bytes.fromhex('00000100'))
          if not (is_png or is_ico): raise SystemExit('favicon.ico returned neither PNG nor ICO bytes')
          if not ('content-type: image/png' in headers or 'content-type: image/x-icon' in headers):
            raise SystemExit('favicon.ico returned incorrect image content type')
          print('PASS favicon data and MIME')
          PYICON
          curl --fail --show-error --output /tmp/smart24-sitemap.xml http://127.0.0.1:3000/sitemap.xml
          curl --fail --show-error --output /tmp/smart24-home.html http://127.0.0.1:3000/
          # Dynamic blog must show genuine automatically generated ride-review links.
          # Blog HTML must not wait for the external Naver RSS response.
          curl --fail --show-error --max-time 4 --output /tmp/smart24-blog.html http://127.0.0.1:3000/blog/
          grep -q 'id="automated-real-ride-blog-reviews"' /tmp/smart24-blog.html
          grep -q 'id="dynamic-blog-service-directory"' /tmp/smart24-blog.html
          grep -q 'id="gijang-taksong-blog-originals"' /tmp/smart24-blog.html
          grep -q '224388244274' /tmp/smart24-blog.html
          curl --fail --show-error --output /tmp/smart24-gijang.html http://127.0.0.1:3000/taksong/busan/gijang-gun/
          grep -q 'id="gijang-original-blog-evidence"' /tmp/smart24-gijang.html
          grep -q '224388244274' /tmp/smart24-gijang.html
          grep -q '224398217114' /tmp/smart24-gijang.html
          grep -q '설악산탁송 요금·후기' /tmp/smart24-blog.html
          grep -q '지리산탁송 요금·후기' /tmp/smart24-blog.html
          grep -q '자전거길탁송 요금·후기' /tmp/smart24-blog.html
          grep -q '/fare/' /tmp/smart24-blog.html
          grep -q '/region/daegu-daeri-taksong/' /tmp/smart24-blog.html
          grep -Eq 'href="/reviews/history/excel-[0-9]{4}/"' /tmp/smart24-blog.html
          blog_review_path=$(grep -oE 'href="/reviews/history/excel-[0-9]{4}/"' /tmp/smart24-blog.html | head -1 | cut -d '"' -f2)
          test -n "$blog_review_path"
          curl --fail --show-error --output /tmp/smart24-blog-review.html "http://127.0.0.1:3000$blog_review_path"
          grep -q '빠른 배차에 도움이 되는 준비사항' /tmp/smart24-blog-review.html
          grep -q '당시 요금과 현재 예상요금은 왜 다를까요' /tmp/smart24-blog-review.html
          grep -q 'rel="canonical"' /tmp/smart24-blog-review.html
          curl --fail --show-error --output /tmp/smart24-priority-review-sitemap.xml http://127.0.0.1:3000/sitemap-priority.xml
          grep -q "$blog_review_path" /tmp/smart24-priority-review-sitemap.xml
          grep -q '네이버 블로그' /tmp/smart24-blog.html
          echo 'PASS dynamic blog displays recorded ride reviews and retains Naver archive'
          curl --fail --show-error --output /tmp/smart24-seoul.html http://127.0.0.1:3000/daeri/seoul/
          grep -q 'tel:18114294' /tmp/smart24-home.html
          grep -q 'tel:18114294' /tmp/smart24-seoul.html
          png_path=$(node -e "const s=require('fs').readFileSync('/tmp/smart24-seoul.html','utf8');const m=s.match(/\\/card\\/area-[0-9]+-daeri-brand-v6\\.png/);if(!m)process.exit(1);process.stdout.write(m[0])")
          test -n "$png_path"
          curl --fail --show-error --output /tmp/smart24-region.png "http://127.0.0.1:3000$png_path" || { cat /tmp/smart24-server.log; exit 1; }
          file /tmp/smart24-region.png | grep -q 'PNG image data'
          grep -q 'og:image' /tmp/smart24-seoul.html
          # Ensure major local service pages are discoverable in their sitemap.
          curl --fail --show-error --output /tmp/smart24-taksong-sitemap.xml http://127.0.0.1:3000/sitemap-taksong.xml
          grep -q '/taksong/' /tmp/smart24-taksong-sitemap.xml
          # Regional sitemaps must list actual pages, not separate generated car-card images.
          if grep -Eq '<image:image|<image:loc' /tmp/smart24-taksong-sitemap.xml; then
            echo 'Generated card illustration URL remains in taksong sitemap'
            exit 1
          fi
          curl --fail --show-error --output /tmp/smart24-daeri-sitemap.xml http://127.0.0.1:3000/sitemap-daeri.xml
          if grep -Eq '<image:image|<image:loc' /tmp/smart24-daeri-sitemap.xml; then
            echo 'Generated card illustration URL remains in daeri sitemap'
            exit 1
          fi
          curl --fail --show-error --output /tmp/smart24-robots.txt http://127.0.0.1:3000/robots.txt
          grep -q 'Sitemap: https://jeongukdaeri.kr/sitemap-taksong.xml' /tmp/smart24-robots.txt
          grep -q 'Sitemap: https://jeongukdaeri.kr/sitemap-daeri.xml' /tmp/smart24-robots.txt
          curl --fail --show-error --output /tmp/smart24-seoraksan.html http://127.0.0.1:3000/special/seoraksan-transport/
          grep -q '<h1>설악산탁송 요금·실제후기' /tmp/smart24-seoraksan.html
          echo 'PASS crawler discovery sitemaps and updated Seoraksan title'
          # A sitemap URL must be a real indexable HTML destination, not just a listed string.
          curl --fail --show-error --output /tmp/smart24-priority-sitemap.xml http://127.0.0.1:3000/sitemap-priority.xml
          python3 - <<'PYINDEX'
          import urllib.request
          from urllib.parse import quote
          import xml.etree.ElementTree as ET
          base='http://127.0.0.1:3000'
          root=ET.parse('/tmp/smart24-priority-sitemap.xml').getroot()
          listed={node.text for node in root.iter() if node.tag.endswith('loc') and node.text}
          required=[
            '/설악산탁송/',
            '/지리산탁송/',
            '/special/cycling-trail-transport/',
            '/reviews/taksong/',
            '/reviews/verified/',
            '/routes/reviewed/',
            '/region/daegu-daeri-taksong/',
            '/fare/',
            '/blog/',
            '/route-taksong/centers/',
          ]
          for path in required:
            expected='https://jeongukdaeri.kr'+path
            if expected not in listed:
              raise SystemExit('Priority sitemap missing '+path)
            with urllib.request.urlopen(base+quote(path),timeout=20) as response:
              page=response.read().decode('utf-8')
              if response.status!=200:
                raise SystemExit('Priority URL non-200 '+path)
              if 'noindex' in page.lower() or '<link rel="canonical"' not in page:
                raise SystemExit('Priority URL not index-ready '+path)
            print('PASS priority indexable URL',path)
          PYINDEX
          grep -q 'rel="canonical"' /tmp/smart24-seoul.html
          # Verify a paginated keyword directory links to real regional destinations.
          curl --fail --show-error --output /tmp/smart24-keywords.html 'http://127.0.0.1:3000/keywords/taksong/?page=2'
          grep -q 'href="/taksong/' /tmp/smart24-keywords.html
          grep -q '/keywords/taksong/?page=2' /tmp/smart24-keywords.html
          # Check the first dynamic region page and its clickable PNG card.
          region_path=$(node -e "const s=require('fs').readFileSync('/tmp/smart24-sitemap.xml','utf8');const m=s.match(/\\/region\\/area-[0-9]+\\//);if(!m)process.exit(1);process.stdout.write(m[0])")
          test -n "$region_path"
          curl --fail --show-error --output /tmp/smart24-region.html "http://127.0.0.1:3000$region_path"
          grep -q 'href="tel:18114294"' /tmp/smart24-region.html
          grep -q 'encodingFormat":"image/png"' /tmp/smart24-region.html
          grep -q '/card/area-' /tmp/smart24-region.html
          # Public ride history must not expose departure times or privacy placeholder labels.
          curl --fail --show-error --output /tmp/smart24-rides.json http://127.0.0.1:3000/api/public-rides
          node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/smart24-rides.json','utf8'));if(!Array.isArray(rows)||rows.some(r=>('time' in r)||('departure_time' in r)))process.exit(1)"
          if grep -Eq '시간 비공개|시간 미공개|출발 시간' /tmp/smart24-home.html; then echo 'Public homepage leaks time labels'; exit 1; fi
          echo 'Smart24 local HTTP smoke checks passed'
          node tests/daeri-editorial.test.js
          node tests/site-full-50.test.js http://127.0.0.1:3000/
          node tests/keyword-dynamic-50.test.js http://127.0.0.1:3000/
          node tests/business-company-keywords.test.js http://127.0.0.1:3000/
