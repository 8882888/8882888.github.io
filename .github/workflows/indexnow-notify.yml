name: Notify Naver IndexNow (updated priority regions)
on:
  workflow_run:
    workflows: ['Deploy to Cloudtype']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smart24-indexnow-priority
  cancel-in-progress: false
jobs:
  notify:
    # Do not notify Naver about a revision until its actual Cloudtype deployment has succeeded.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate notifier and changed-page selection
        run: |
          node --check scripts/indexnow-notify.js
          node tests/indexnow-targeting.test.js
      - name: Wait for Cloudtype live key and notify Naver once
        run: node scripts/indexnow-notify.js
