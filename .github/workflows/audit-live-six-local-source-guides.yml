name: Audit six source-backed Cloudtype locality guides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-six-local-source-guides.yml'
      - 'scripts/audit-live-six-local-source-guides.cjs'
      - 'data/verified-archive-local-context-20261117.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart24-six-original-live-http
  cancel-in-progress: true

jobs:
  verify-six-existing-pages:
    name: Live HTTP canonical, 13 links and customer notes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out current verified archive source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only production HTTP check (not a Naver indexing claim)
        env:
          LIVE_SITE_URL: https://jeongukdaeri.kr
        run: node scripts/audit-live-six-local-source-guides.cjs
