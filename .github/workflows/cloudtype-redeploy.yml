name: Redeploy official Cloudtype site on verified repository changes

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'index.html'
      - 'data/**'
      - 'lib/**'
      - 'blog/**'
      - 'business/**'
      - 'service/**'
      - 'region/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'sitemap*.xml'
      - '.github/workflows/cloudtype-redeploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart24-cloudtype-production-redeploy
  cancel-in-progress: true

jobs:
  request-existing-cloudtype-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
      CLOUDTYPE_PROJECT: ${{ vars.CLOUDTYPE_PROJECT }}
      CLOUDTYPE_APP: ${{ vars.CLOUDTYPE_APP }}
      CLOUDTYPE_STAGE: ${{ vars.CLOUDTYPE_STAGE }}
      CLOUDTYPE_DEPLOY_YAML: ${{ secrets.CLOUDTYPE_DEPLOY_YAML }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production image dependencies for dynamic regional cards
        run: npm install --omit=dev --no-audit --no-fund
      - name: Test REAL Cloudtype Node startup and SEO routes before redeploy
        run: |
          node --check server.js
          node --check lib/cycling-centers.js
          node --check lib/keyword-card-expansion.js
          node tools/check_cloudtype_20_point_readiness.js
          node tools/check_cloudtype_100_point_release.js
          node tests/cycling-keyword-intents-20261106.test.js
          node tests/cycling-original-assets-only-20261106.test.js
          node tests/homepage-top-services.test.js
          node tests/five-keyword-landing-20261106.test.js
          node tests/kstyle-five-primary-services-20261106.test.js
          node tests/nationwide-daeri-24h-taksong-keywords.test.js
          node tests/review-first-search-titles-20261106.test.js
          node tests/night-taksong-intent-alias-and-proof.test.js
          node tests/homepage-service-first-20261106.test.js
          node tests/homepage-copy.test.js
          node tests/keyword-preview.test.js
          node tests/regional-history-ambiguity.test.js
          node tools/check_core_seo.js
          node tools/smoke_production_server.js
          python3 -m py_compile tools/audit_live_seo.py
      - name: Check original Cloudtype application binding safely
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -z "$CLOUDTYPE_TOKEN" ] && missing="${missing} CLOUDTYPE_TOKEN(secret)"
          [ -z "$CLOUDTYPE_PROJECT" ] && missing="${missing} CLOUDTYPE_PROJECT(variable)"
          [ -z "$CLOUDTYPE_APP" ] && missing="${missing} CLOUDTYPE_APP(variable)"
          [ -z "$CLOUDTYPE_STAGE" ] && missing="${missing} CLOUDTYPE_STAGE(variable)"
          [ -z "$CLOUDTYPE_DEPLOY_YAML" ] && missing="${missing} CLOUDTYPE_DEPLOY_YAML(secret)"
          if [ -n "$missing" ]; then
            echo "### Cloudtype production redeploy BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing configuration:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Copy the existing application's deployment YAML from its Cloudtype CLI tab; do not invent an application or publish credentials." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No production redeploy was requested. Missing:$missing"
            exit 1
          fi
          # Fail closed if the supplied YAML is for a different application.
          printf '%s\n' "$CLOUDTYPE_DEPLOY_YAML" > "$RUNNER_TEMP/cloudtype-existing-app.yml"
          export ORIGINAL_APP="$CLOUDTYPE_APP"
          python3 - <<'PY'
          import os,re,pathlib,sys
          source=pathlib.Path(os.environ['RUNNER_TEMP'],'cloudtype-existing-app.yml').read_text()
          matches=re.findall(r'^name:\s*["\x27]?([^\s"\x27#]+)',source,re.M)
          if len(matches)!=1 or matches[0]!=os.environ['ORIGINAL_APP']:
              print('::error::Cloudtype deployment YAML name does not match CLOUDTYPE_APP; no deployment requested.')
              sys.exit(1)
          if not re.search(r'^app:\s*\S+',source,re.M):
              print('::error::Cloudtype original YAML has no app type; no deployment requested.')
              sys.exit(1)
          print('Original Cloudtype app identity matches deployment YAML.')
          PY
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "### Existing Cloudtype application binding validated" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: pre-existing project/stage and application name from repository configuration. No new project or domain created." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy existing Cloudtype application using OFFICIAL action
        if: steps.connection.outputs.enabled == 'true'
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE }}
          allStages: false
          yaml: ${{ secrets.CLOUDTYPE_DEPLOY_YAML }}
      - name: Record accepted deployment request
        if: steps.connection.outputs.enabled == 'true'
        run: |
          echo '### Official Cloudtype deploy action completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not prove the public site has updated. Comparing the live release hash next.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm LIVE Cloudtype release matches GitHub source
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum server.js | cut -c1-16)"
          verified=false
          for n in $(seq 1 18); do
            response="$(curl --fail --silent --show-error --connect-timeout 8 --max-time 14 -H 'Cache-Control: no-cache' 'https://jeongukdaeri.kr/health' 2>/dev/null || true)"
            actual="$(jq -r '.release // ""' <<<"$response" 2>/dev/null || true)"
            if [ "$actual" = "sha256-$expected" ]; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != true ]; then
            echo '### Cloudtype live deployment NOT verified' >> "$GITHUB_STEP_SUMMARY"
            echo "Live /health did not report the GitHub server.js release sha256-$expected within the verification window." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudtype redeploy request may have been accepted, but the official public site did not confirm the latest Node release."
            exit 1
          fi
          # Verify the actual served homepage, not only the unchanged server.js release.
          # An older Cloudtype build can expose the same server.js hash while
          # missing newly updated index.html and fixed navigation.
          homepage="$(curl --fail --silent --show-error --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' 'https://jeongukdaeri.kr/?verify=regional-quick-entry-20261106')"
          if ! grep -Fq 'id="regional-quick-entry-20261106"' <<<"$homepage"; then
            echo '### Cloudtype homepage content NOT verified' >> "$GITHUB_STEP_SUMMARY"
            echo 'The live homepage is missing the provincial entry grid committed to index.html.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Live Cloudtype homepage is stale even if /health reports the server.js hash.'
            exit 1
          fi
          if ! grep -Fq 'id="homepage-primary-services-20261106"' <<<"$homepage" || ! grep -Fq '2,591' <<<"$homepage"; then
            echo '::error::Fixed primary services or verified ride-history summary missing from live homepage.'
            exit 1
          fi
          if ! grep -Fq 'id="keyword-service-navigation-20261106"' <<<"$homepage" || grep -Fq 'id="dynamic-service-card-search-20261103"' <<<"$homepage"; then
            echo '::error::Live homepage still exposes the retired illustration preview or lacks keyword-specific navigation.'
            exit 1
          fi
          if grep -Eq '지역·코스·서비스 키워드별 동적 (명함|이미지) 자동보기|지역별 명함 자동확장 보기' <<<"$homepage"; then
            echo '::error::Live homepage still contains wording explicitly retired by the site owner.'
            exit 1
          fi
          # The two exact-region images shown on homepage search must be real
          # accessible SVG responses, not a broken URL or a cached vehicle photo.
          python3 - <<'PY'
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          host = 'https://jeongukdaeri.kr'
          for keyword, slug in [
              ('부산대리운전', 'area-494-daeri'),
              ('대구탁송', 'area-765-taksong'),
              ('대전대리운전', 'area-1672-daeri'),
              ('세종탁송', 'area-2063-taksong'),
              ('제주도탁송', 'area-20348-taksong'),
          ]:
              url = host + '/keyword-card/exact/' + slug + '.svg?' + urlencode({'q': keyword})
              request = Request(url, headers={'Cache-Control':'no-cache','User-Agent':'Smart24-keyword-image-release-check'})
              try:
                  with urlopen(request, timeout=20) as response:
                      mime = response.headers.get('Content-Type', '')
                      body = response.read(1000000).decode('utf-8', errors='replace')
                      if response.status != 200 or 'image/svg+xml' not in mime or keyword not in body:
                          raise ValueError('invalid status, SVG MIME, or exact keyword')
                      if re.search(r'<(?:image|foreignObject)\b', body, re.I):
                          raise ValueError('unexpected embedded photo or foreign object')
              except Exception as error:
                  raise SystemExit(f'::error::LIVE keyword SVG failed for {keyword}: {error}')
              print(f'PASS live keyword image: {keyword} ({slug})')
          PY
          if ! grep -Fq 'id="mobile-direct-image-priority"' <<<"$homepage"; then
            echo '::error::Homepage original Seoraksan/Jirisan fare poster section missing.'
            exit 1
          fi
          echo 'Live homepage provincial links, fixed primary services and verified ride-history label confirmed.' >> "$GITHUB_STEP_SUMMARY"
          echo '### Cloudtype live deployment verified' >> "$GITHUB_STEP_SUMMARY"
          echo "Production /health release matches GitHub server.js sha256-$expected." >> "$GITHUB_STEP_SUMMARY"
          echo 'Live deployment verified. Naver Search Advisor indexing and search ranking remain separate checks.' >> "$GITHUB_STEP_SUMMARY"
