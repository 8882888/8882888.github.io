name: Redeploy official Cloudtype site on verified repository changes

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'index.html'
      - 'data/**'
      - 'lib/**'
      - 'blog/**'
      - 'business/**'
      - 'service/**'
      - 'region/**'
      - 'assets/**'
      - 'sitemap*.xml'
      - '.github/workflows/cloudtype-redeploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart24-cloudtype-production-redeploy
  cancel-in-progress: true

jobs:
  request-existing-cloudtype-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
      CLOUDTYPE_PROJECT: ${{ vars.CLOUDTYPE_PROJECT }}
      CLOUDTYPE_APP: ${{ vars.CLOUDTYPE_APP }}
      CLOUDTYPE_STAGE: ${{ vars.CLOUDTYPE_STAGE }}
      CLOUDTYPE_DEPLOY_YAML: ${{ secrets.CLOUDTYPE_DEPLOY_YAML }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production image dependencies for dynamic regional cards
        run: npm install --omit=dev --no-audit --no-fund
      - name: Test REAL Cloudtype Node startup and SEO routes before redeploy
        run: |
          node --check server.js
          node tools/check_cloudtype_20_point_readiness.js
          node tests/homepage-top-services.test.js
          node tests/regional-history-ambiguity.test.js
          node tools/check_core_seo.js
          node tools/smoke_production_server.js
          python3 -m py_compile tools/audit_live_seo.py
      - name: Check original Cloudtype application binding safely
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -z "$CLOUDTYPE_TOKEN" ] && missing="${missing} CLOUDTYPE_TOKEN(secret)"
          [ -z "$CLOUDTYPE_PROJECT" ] && missing="${missing} CLOUDTYPE_PROJECT(variable)"
          [ -z "$CLOUDTYPE_APP" ] && missing="${missing} CLOUDTYPE_APP(variable)"
          [ -z "$CLOUDTYPE_STAGE" ] && missing="${missing} CLOUDTYPE_STAGE(variable)"
          [ -z "$CLOUDTYPE_DEPLOY_YAML" ] && missing="${missing} CLOUDTYPE_DEPLOY_YAML(secret)"
          if [ -n "$missing" ]; then
            echo "### Cloudtype production redeploy BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing configuration:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Copy the existing application's deployment YAML from its Cloudtype CLI tab; do not invent an application or publish credentials." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No production redeploy was requested. Missing:$missing"
            exit 1
          fi
          # Fail closed if the supplied YAML is for a different application.
          printf '%s\n' "$CLOUDTYPE_DEPLOY_YAML" > "$RUNNER_TEMP/cloudtype-existing-app.yml"
          export ORIGINAL_APP="$CLOUDTYPE_APP"
          python3 - <<'PY'
          import os,re,pathlib,sys
          source=pathlib.Path(os.environ['RUNNER_TEMP'],'cloudtype-existing-app.yml').read_text()
          matches=re.findall(r'^name:\s*["\x27]?([^\s"\x27#]+)',source,re.M)
          if len(matches)!=1 or matches[0]!=os.environ['ORIGINAL_APP']:
              print('::error::Cloudtype deployment YAML name does not match CLOUDTYPE_APP; no deployment requested.')
              sys.exit(1)
          if not re.search(r'^app:\s*\S+',source,re.M):
              print('::error::Cloudtype original YAML has no app type; no deployment requested.')
              sys.exit(1)
          print('Original Cloudtype app identity matches deployment YAML.')
          PY
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "### Existing Cloudtype application binding validated" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: pre-existing project/stage and application name from repository configuration. No new project or domain created." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy existing Cloudtype application using OFFICIAL action
        if: steps.connection.outputs.enabled == 'true'
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE }}
          allStages: false
          yaml: ${{ secrets.CLOUDTYPE_DEPLOY_YAML }}
      - name: Record accepted deployment request
        if: steps.connection.outputs.enabled == 'true'
        run: |
          echo '### Official Cloudtype deploy action completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not prove the public site has updated. Comparing the live release hash next.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm LIVE Cloudtype release matches GitHub source
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum server.js | cut -c1-16)"
          verified=false
          for n in $(seq 1 18); do
            response="$(curl --fail --silent --show-error --connect-timeout 8 --max-time 14 -H 'Cache-Control: no-cache' 'https://jeongukdaeri.kr/health' 2>/dev/null || true)"
            actual="$(jq -r '.release // ""' <<<"$response" 2>/dev/null || true)"
            if [ "$actual" = "sha256-$expected" ]; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != true ]; then
            echo '### Cloudtype live deployment NOT verified' >> "$GITHUB_STEP_SUMMARY"
            echo "Live /health did not report the GitHub server.js release sha256-$expected within the verification window." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudtype redeploy request may have been accepted, but the official public site did not confirm the latest Node release."
            exit 1
          fi
          echo '### Cloudtype live deployment verified' >> "$GITHUB_STEP_SUMMARY"
          echo "Production /health release matches GitHub server.js sha256-$expected." >> "$GITHUB_STEP_SUMMARY"
          echo 'Live deployment verified. Naver Search Advisor indexing and search ranking remain separate checks.' >> "$GITHUB_STEP_SUMMARY"
