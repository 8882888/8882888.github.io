name: Redeploy official Cloudtype site on verified repository changes

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'index.html'
      - 'data/**'
      - 'lib/**'
      - 'blog/**'
      - 'business/**'
      - 'service/**'
      - 'region/**'
      - 'assets/**'
      - 'sitemap*.xml'
      - '.github/workflows/cloudtype-redeploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart24-cloudtype-production-redeploy
  cancel-in-progress: true

jobs:
  request-existing-cloudtype-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
      CLOUDTYPE_PROJECT: ${{ vars.CLOUDTYPE_PROJECT }}
      CLOUDTYPE_APP: ${{ vars.CLOUDTYPE_APP }}
      CLOUDTYPE_STAGE: ${{ vars.CLOUDTYPE_STAGE }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production image dependencies for dynamic regional cards
        run: npm install --omit=dev --no-audit --no-fund
      - name: Test REAL Cloudtype Node startup and SEO routes before redeploy
        run: |
          node --check server.js
          node tests/regional-history-ambiguity.test.js
          node tools/check_core_seo.js
          node tools/smoke_production_server.js
          python3 -m py_compile tools/audit_live_seo.py
      - name: Check whether existing Cloudtype deployment is connected
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDTYPE_TOKEN" ] || [ -z "$CLOUDTYPE_PROJECT" ] || [ -z "$CLOUDTYPE_APP" ] || [ -z "$CLOUDTYPE_STAGE" ]; then
            echo "::notice::Cloudtype redeploy not connected. Requires CLOUDTYPE_TOKEN secret and CLOUDTYPE_PROJECT, CLOUDTYPE_APP, CLOUDTYPE_STAGE repository variables. No deployment requested."
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### Cloudtype: no deployment requested' >> "$GITHUB_STEP_SUMMARY"
            echo 'Cloudtype API key or existing app identifiers are not configured. The source startup test ran, but Cloudtype production is NOT updated by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo '### Cloudtype redeploy: configuration present' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Request Cloudtype to redeploy the EXISTING application
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg project "$CLOUDTYPE_PROJECT" --arg app "$CLOUDTYPE_APP" --arg stage "$CLOUDTYPE_STAGE" '{project:$project,app:$app,stage:$stage}')"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 55 --retry 1 \
            --request POST 'https://api.cloudtype.io/webhooks/deploy' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $CLOUDTYPE_TOKEN" \
            --data "$payload" --output /tmp/smart24-deploy-response.json
          echo 'Cloudtype deployment requested for the configured existing application.'
          echo 'This confirms request acceptance only. Production deployment and Naver indexing are separate.'
          echo 'Cloudtype existing-app redeploy request accepted. Verify actual live HTML and source SHA256 separately.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudtype redeploy request accepted; live SHA256 verification begins next.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm LIVE Cloudtype release matches GitHub source
        if: steps.connection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum server.js | cut -c1-16)"
          verified=false
          for n in $(seq 1 18); do
            response="$(curl --fail --silent --show-error --connect-timeout 8 --max-time 14 -H 'Cache-Control: no-cache' 'https://jeongukdaeri.kr/health' 2>/dev/null || true)"
            actual="$(jq -r '.release // ""' <<<"$response" 2>/dev/null || true)"
            if [ "$actual" = "sha256-$expected" ]; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != true ]; then
            echo '### Cloudtype live deployment NOT verified' >> "$GITHUB_STEP_SUMMARY"
            echo "Live /health did not report the GitHub server.js release sha256-$expected within the verification window." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cloudtype redeploy request may have been accepted, but the official public site did not confirm the latest Node release."
            exit 1
          fi
          echo '### Cloudtype live deployment verified' >> "$GITHUB_STEP_SUMMARY"
          echo "Production /health release matches GitHub server.js sha256-$expected." >> "$GITHUB_STEP_SUMMARY"
          echo 'Live deployment verified. Naver Search Advisor indexing and search ranking remain separate checks.' >> "$GITHUB_STEP_SUMMARY"
