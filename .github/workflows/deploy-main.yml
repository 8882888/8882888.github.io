          samples={}
          def get(path):
              # A single read timeout must not masquerade as an obsolete release.
              # Retain final failure after 3 attempts and record every attempt's
              # true wall time. CI probes are not verified Naver/Yeti requests.
              url=base+path+('&' if '?' in path else '?')+'deploy-check='+commit
              for attempt in range(3):
                  started=time.monotonic()
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Smart24-CI-Deploy-Smoke/1.0'})
                      with urllib.request.urlopen(request,timeout=18) as response:
                          body=response.read().decode('utf-8')
                          code=response.status
                      elapsed=round(time.monotonic()-started,3)
                      samples[path]={'http_status':code,'bytes':len(body.encode('utf-8')),'elapsed_s':elapsed,'attempts':attempt+1}
                      if code!=200: raise ValueError(path+' HTTP '+str(code))
                      if attempt: print('RECOVERED after transient read failure',path,'attempt',attempt+1,elapsed,'s')
                      return body
                  except Exception as error:
                      elapsed=round(time.monotonic()-started,3)
                      print('LIVE_HTTP_ATTEMPT_FAILED',path,'attempt',attempt+1,'elapsed_s',elapsed,'error',str(error)[:170],flush=True)
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          home=get('/')
