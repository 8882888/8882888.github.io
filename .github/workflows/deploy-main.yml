name: Deploy to Cloudtype
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: cloudtype-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/smart24-server-check.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This public repository can be cloned over HTTPS without a deploy key.
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: smart24-taksong/8882888
          stage: main
          yaml: |
            name: smart24-taksong-backup
            app: dockerfile
            options:
              ports: "3000"
              env: []
              args: []
            context:
              git:
                url: https://github.com/${{ github.repository }}.git
                ref: ${{ github.ref }}
