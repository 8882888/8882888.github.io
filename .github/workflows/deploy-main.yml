name: Deploy to Cloudtype
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Keyword automation]
    types: [completed]
    branches: [main]
concurrency:
  group: cloudtype-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/smart24-server-check.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This public repository can be cloned over HTTPS without a deploy key.
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: smart24-taksong/8882888
          stage: main
          yaml: |
            name: smart24-taksong-backup
            app: dockerfile
            options:
              ports: "3000"
              env: []
              args: []
            context:
              git:
                url: https://github.com/${{ github.repository }}.git
                ref: ${{ github.ref }}

      - name: Verify deployed regional service revision
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import os,time,urllib.request
          url='https://jeongukdaeri.kr/taksong/busan/?release-check='+os.environ['DEPLOYED_COMMIT']
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=10) as response:
                      page=response.read().decode('utf-8')
                  if 'BreadcrumbList' in page and 'href="/taksong/">전국 탁송' in page:
                      print('PASS: live regional service revision and hierarchy verified')
                      break
              except Exception:
                  pass
              if attempt==23:
                  raise SystemExit('Deployment API accepted the request, but live revision verification did not pass; do not report production rollout as complete.')
              time.sleep(5)
          PYVERIFY
