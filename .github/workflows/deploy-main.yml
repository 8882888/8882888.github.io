name: Deploy to Cloudtype
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Keyword automation]
    types: [completed]
    branches: [main]
concurrency:
  group: cloudtype-production
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/smart24-server-check.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This public repository can be cloned over HTTPS without a deploy key.
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: smart24-taksong/8882888
          stage: main
          yaml: |
            name: smart24-taksong-backup
            app: dockerfile
            options:
              ports: "3000"
              env: []
              args: []
            context:
              git:
                url: https://github.com/${{ github.repository }}.git
                ref: ${{ github.ref }}

      - name: Verify deployed regional service revision
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import os,time,urllib.request
          url='https://jeongukdaeri.kr/taksong/busan/?release-check='+os.environ['DEPLOYED_COMMIT']
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=10) as response:
                      page=response.read().decode('utf-8')
                  with urllib.request.urlopen('https://jeongukdaeri.kr/taksongdaeri/',timeout=10) as response:
                      guide=response.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/daeri/daegu/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      daegu_page=response.read().decode('utf-8')
                  regional_brand_ok=('대구스마트대리운전' not in daegu_page
                    and '<figcaption style="text-align:center">대구대리운전 ·' in daegu_page)
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      home=response.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/assets/traffic-analytics.js?v='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      tracker=response.read().decode('utf-8')
                  with urllib.request.urlopen('https://jeongukdaeri.kr/favicon.ico',timeout=10) as response:
                      icon_ok=response.status==200 and response.headers.get('Content-Type','').startswith('image/')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/assets/traffic-summary.css?v='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      traffic_css=response.read().decode('utf-8')
                  stats_ok=('오늘 접속' in home
                    and '누적 접속기록' in home
                    and '전화버튼 클릭' in home
                    and 'id="traffic-call-trigger"' in home
                    and 'id="exclude-my-visits"' in home
                    and 'id="phone-source-list"' in home
                    and 'id="top-fare-calculator"' in home
                    and '/routes/taksong/area-494/area-1174/' in home
                    and '20261030-count-accuracy' in home
                    and 'traffic-summary.css?v=20261030' in home
                    and 'smart24_exclude_own_visits_v1' in tracker
                    and 'smart24_last_recorded_visit_day' in tracker
                    and '.traffic-stats .traffic-stats-lines' in traffic_css
                    and '유입 경로 미확인' in tracker and 'acquisition();' in tracker)
                  region_stats_ok=('id="traffic-stats-panel"' in page
                    and 'id="exclude-my-visits"' in page)
                  if 'BreadcrumbList' in page and 'href="/taksong/">전국 탁송' in page and guide.count('<h1>')==1 and 'v.length===4' in home and icon_ok and stats_ok and region_stats_ok and regional_brand_ok:
                      print('PASS: live Cloudtype stats, region labels, phone actions, and regional hierarchy verified')
                      break
              except Exception:
                  pass
              if attempt==23:
                  raise SystemExit('Deployment accepted, but live HTML/compact counters/own-visit opt-out did NOT reflect the new release; investigate Cloudtype rollout or cache.')
              time.sleep(5)
          PYVERIFY
      - name: Verify current Naver-focused and Seoul taksong editorial landing pages
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYNAVER'
          import os,time,urllib.request,xml.etree.ElementTree as ET
          base='https://jeongukdaeri.kr'
          expected={
            '/special/seoraksan-transport/':'<h1>설악산탁송 요금·실제후기',
            '/special/jirisan-transport/':'<h1>지리산탁송 요금·실제후기',
            '/special/cycling-trail-transport/':'<h1>전국 자전거길탁송 요금·실제후기',
            '/blog/seoul-taksong/':'<h1>서울탁송 25개 구',
            '/blog/seoul-taksong/gangnam-seocho-songpa-gangdong/':'<h1>강남·서초·송파·강동구 탁송',
            '/reviews/taksong/':'completed-case-conversion-first-202611',
            '/region/daegu-daeri-taksong/':'daegu-route-real-review-first-202611',
          }
          for attempt in range(18):
            missing=[]
            for path,text in expected.items():
              try:
                req=urllib.request.Request(base+path+'?release-check='+os.environ['DEPLOYED_COMMIT'],
                  headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
                with urllib.request.urlopen(req,timeout=12) as response:
                  html=response.read().decode('utf-8')
                  if response.status!=200 or text not in html or '1811-4294' not in html:
                    missing.append(path)
              except Exception as e:
                missing.append(path+': '+str(e))
            if not missing:
              print('PASS five latest customer-facing landing pages')
              break
            if attempt==17:
              raise SystemExit('Latest landing pages not deployed or stale: '+', '.join(missing))
            time.sleep(5)
          # Verify mobile search keyword routing and the first visible mountain poster on production.
          from urllib.parse import quote
          mountain_cases=[
            ('설악산탁송','seoraksan'),('한계령소공원탁송','seoraksan'),
            ('지리산탁송','jirisan'),('성삼재중산리탁송','jirisan')
          ]
          for keyword,mountain in mountain_cases:
            route='/'+('설악산탁송' if mountain=='seoraksan' else '지리산탁송')+'/'
            url=base+'/?q='+quote(keyword)+'&release-check='+os.environ['DEPLOYED_COMMIT']
            with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as response:
              page=response.read().decode('utf-8')
              landing=response.geturl()
            table='<section id="mountain-route-fare-table-202611"'
            poster='<figure id="original-mountain-fare-visual"'
            picture='/assets/'+mountain+'-taksong-original-fare.png'
            # Original fare PNG must lead the canonical mobile page; the accessible
            # HTML fare table remains directly in the main page content.
            if quote(route) not in landing or table not in page or poster not in page or page.index(poster)>page.index(table) or not page.startswith('<!doctype html>') or ('src="'+picture+'"') not in page:
              raise SystemExit('Mountain original poster-first landing mismatch: '+keyword+' -> '+landing)
            image_req=urllib.request.Request(base+picture+'?release-check='+os.environ['DEPLOYED_COMMIT'],headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(image_req,timeout=15) as image_response:
              if image_response.status!=200 or image_response.read(8)!=bytes.fromhex('89504e470d0a1a0a'):
                raise SystemExit('Mountain original fare PNG unavailable: '+picture)
            print('PASS mountain mobile route + original fare poster',keyword)
          # Korean SEO paths must be the public canonical, not duplicate legacy canonical URLs.
          for label,mountain in [('설악산탁송','seoraksan'),('지리산탁송','jirisan')]:
            route='/'+label+'/'
            req=urllib.request.Request(base+quote(route)+'?release-check='+os.environ['DEPLOYED_COMMIT'],headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=15) as response:
              page=response.read().decode('utf-8')
            if 'rel="canonical" href="'+base+route+'"' not in page or '/assets/'+mountain+'-taksong-original-fare.png' not in page:
              raise SystemExit('Korean keyword canonical or original fare poster missing: '+route)
            print('PASS public Korean mountain URL',route)
          # Confirm the deployed server is reading the same current HTML files.
          import json
          probe=urllib.request.Request(base+'/health/seo.json?release-check='+os.environ['DEPLOYED_COMMIT'],
            headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
          with urllib.request.urlopen(probe,timeout=15) as response:
            data=json.loads(response.read().decode('utf-8'))
            if response.status!=200: raise SystemExit('SEO freshness probe HTTP '+str(response.status))
          expected_titles={
            'seoraksan':'설악산탁송 요금·실제후기',
            'jirisan':'지리산탁송 요금·실제후기',
            'cycling':'전국 자전거길탁송 요금·실제후기'
          }
          for key,phrase in expected_titles.items():
            if phrase not in data.get('pages',{}).get(key,{}).get('h1',''):
              raise SystemExit('Live source is outdated: '+key)
          if not all(x.get('hasPhone') for x in data.get('pages',{}).values()):
            raise SystemExit('SEO freshness probe missing phone on at least one page')
          print('PASS live source file freshness probe')
          for path in ['/robots.txt','/sitemap-priority.xml','/sitemap.xml','/sitemap-reviewed-routes.xml']:
            req=urllib.request.Request(base+path+'?release-check='+os.environ['DEPLOYED_COMMIT'],
              headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
            with urllib.request.urlopen(req,timeout=15) as response:
              payload=response.read().decode('utf-8')
              if response.status!=200: raise SystemExit(path+' HTTP '+str(response.status))
            if path.endswith('.xml'):
              ET.fromstring(payload)
              if '/reviews/taksong/' not in payload: raise SystemExit(path+' missing taksong evidence URL')
            elif 'Sitemap: '+base+'/sitemap-priority.xml' not in payload:
              raise SystemExit('robots.txt missing priority sitemap')
            print('PASS',path)
          for path in ['/sitemap-taksong.xml','/sitemap-daeri.xml']:
            last_error=''
            for attempt in range(6):
              req=urllib.request.Request(base+path+'?release-check='+os.environ['DEPLOYED_COMMIT']+'&attempt='+str(attempt),
                headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                xml=response.read().decode('utf-8')
                if response.status!=200: raise SystemExit(path+' HTTP '+str(response.status))
                sitemap_version=response.headers.get('X-Smart24-Sitemap-Format','missing')
                cache_control=response.headers.get('Cache-Control','missing')
                cache_age=response.headers.get('Age','missing')
                cache_status=response.headers.get('CF-Cache-Status',response.headers.get('X-Cache','unknown'))
              root=ET.fromstring(xml)
              urls=[node.text for node in root.iter() if node.tag.endswith('loc') and node.text]
              image_entries='<image:image' in xml or '<image:loc' in xml
              if len(urls)<=500 and len(urls)==len(set(urls)) and not image_entries and (not path.endswith('taksong.xml') or any('/taksong/busan/' in u for u in urls)):
                print('PASS focused discovery',path,len(urls),'URL entries; version',sitemap_version)
                break
              last_error=path+' served older or invalid sitemap: locs='+str(len(urls))+' image_entries='+str(image_entries)+' signature='+sitemap_version+' cache_control='+cache_control+' age='+cache_age+' cache_status='+cache_status
              print('RETRY',last_error)
              if attempt<5: time.sleep(5)
            else:
              raise SystemExit(last_error+'; compare site CDN cache and Cloudtype release')
          PYNAVER
      - name: Verify live taksong reviews and search sitemaps
        run: |
          python3 - <<'PYSEO'
          import time, urllib.request, xml.etree.ElementTree as ET
          base='https://jeongukdaeri.kr'
          paths=['/taksong/','/service/taksong/','/reviews/taksong/','/blog/','/sitemap-priority.xml','/sitemap-reviewed-routes.xml']
          failed=[]
          for path in paths:
              ok=False
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(base+path,headers={'User-Agent':'Smart24-Release-Verification/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          body=response.read()
                          if response.status!=200: raise ValueError('HTTP '+str(response.status))
                      if path.endswith('.xml'):
                          root=ET.fromstring(body)
                          urls=[e.text or '' for e in root.iter() if e.tag.endswith('loc')]
                          if not any('/reviews/taksong/' in u for u in urls):
                              raise ValueError('Missing verified taksong URL')
                      elif path=='/reviews/taksong/' and b'taksong-baekdamsa-sogongwon' not in body:
                          raise ValueError('Verified taksong anchors missing')
                      elif path=='/service/taksong/' and 'taksong-evidence-202611' not in body.decode('utf-8'):
                          raise ValueError('New taksong evidence section not deployed')
                      elif path=='/blog/' and not all(marker in body.decode('utf-8') for marker in ('dynamic-blog-service-directory','automated-real-ride-blog-reviews','search-evidence-service-guide-202611')):
                          raise ValueError('Latest dynamic blog, actual ride reviews or search-intent sections not deployed')
                      print('PASS',path)
                      ok=True
                      break
                  except Exception as e:
                      print('RETRY',path,str(e))
                      time.sleep(3)
              if not ok: failed.append(path)
          if failed: raise SystemExit('Live taksong page or sitemap checks failed: '+', '.join(failed))
          PYSEO
