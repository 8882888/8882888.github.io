name: Deploy to Cloudtype
on:
  push:
    branches:
      - main
    # Code/data that can affect the official Node site still trigger deploy.
    # Tests, audits and workflows alone must not create Cloudtype releases.
    paths:
      - '**'
      - '!tests/**'
      - '!scripts/**'
      - '!tools/**'
      - '!lib/http-audit-retry.mjs'
      - '!.github/workflows/**'
      - '!*.md'
      # A change to the deployment procedure itself warrants one verified release.
      - '.github/workflows/deploy-main.yml'
  workflow_dispatch:
# Keyword automation commits to main already trigger the push event.
# A second workflow_run trigger duplicated each successful automation release.
concurrency:
  # Keep automatic deployment and manual recovery mutually exclusive without canceling an in-flight release.
  group: cloudtype-production
  cancel-in-progress: false
jobs:
  # Fail in seconds on a missing Cloudtype binding, before launching a large
  # test matrix and queuing an impossible deployment.
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDTYPE_PROJECT: ${{ vars.CLOUDTYPE_PROJECT }}
      CLOUDTYPE_APP: ${{ vars.CLOUDTYPE_APP || 'smart24-taksong-backup' }}
      CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
    steps:
      - name: Check existing Cloudtype project binding
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDTYPE_PROJECT" =~ ^[^/]+/8882888$ ]]; then
            echo "::error::CLOUDTYPE_PROJECT must be the verified existing space/8882888. Current value does not identify the project. Open repository Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$CLOUDTYPE_TOKEN" ]; then
            echo "::error::CLOUDTYPE_TOKEN secret is missing."
            exit 1
          fi
          if [ "$CLOUDTYPE_APP" != smart24-taksong-backup ]; then
            echo "::error::Refusing to deploy a service other than the existing smart24-taksong-backup."
            exit 1
          fi
          echo "Preflight passed; existing Cloudtype project and app are configured."
  verify:
    needs: preflight
    uses: ./.github/workflows/smart24-server-check.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
      CLOUDTYPE_PROJECT: ${{ vars.CLOUDTYPE_PROJECT }}
      CLOUDTYPE_APP: ${{ vars.CLOUDTYPE_APP || 'smart24-taksong-backup' }}
      CLOUDTYPE_STAGE: ${{ vars.CLOUDTYPE_STAGE || 'main' }}
      CLOUDTYPE_DEPLOY_YAML: ${{ secrets.CLOUDTYPE_DEPLOY_YAML }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This public repository can be cloned over HTTPS without a deploy key.
      - name: Check original Cloudtype application binding safely
        id: connection
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -z "$CLOUDTYPE_TOKEN" ] && missing="${missing} CLOUDTYPE_TOKEN(secret)"
          [ -z "$CLOUDTYPE_PROJECT" ] && missing="${missing} CLOUDTYPE_PROJECT(variable)"
          [ -z "$CLOUDTYPE_APP" ] && missing="${missing} CLOUDTYPE_APP(variable)"
          if [ -n "$missing" ]; then
            echo "### Cloudtype production redeploy BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing configuration:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Copy the existing application's deployment YAML from its Cloudtype CLI tab; do not invent an application or publish credentials." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No production redeploy was requested. Missing:$missing"
            exit 1
          fi
          # Only the original target Cloudtype project is eligible. Never infer a namespace.
          if [[ "$CLOUDTYPE_PROJECT" != */8882888 ]]; then
            echo "::error::CLOUDTYPE_PROJECT must be the existing [space]/8882888 project, not a new destination."
            exit 1
          fi
          # Prefer the operator's existing private configuration, with a safe
          # fallback to the exact app-name/port/dockerfile manifest they supplied.
          if [ -n "$CLOUDTYPE_DEPLOY_YAML" ]; then
            printf '%s\n' "$CLOUDTYPE_DEPLOY_YAML" > "$RUNNER_TEMP/cloudtype-existing-app.yml"
          else
            cp .cloudtype/app.yaml "$RUNNER_TEMP/cloudtype-existing-app.yml"
          fi
          export ORIGINAL_APP="$CLOUDTYPE_APP"
          python3 - <<'PY'
          import os,re,pathlib,sys
          source=pathlib.Path(os.environ['RUNNER_TEMP'],'cloudtype-existing-app.yml').read_text()
          matches=re.findall(r'^name:\s*["\x27]?([^\s"\x27#]+)',source,re.M)
          if len(matches)!=1 or matches[0]!=os.environ['ORIGINAL_APP']:
              print('::error::Cloudtype deployment YAML name does not match CLOUDTYPE_APP; no deployment requested.')
              sys.exit(1)
          if not re.search(r'^app:\s*\S+',source,re.M):
              print('::error::Cloudtype original YAML has no app type; no deployment requested.')
              sys.exit(1)
          print('Original Cloudtype app identity matches deployment YAML.')
          PY
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "### Existing Cloudtype application binding validated" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: pre-existing project/stage and application name from repository configuration. No new project or domain created." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy with existing Cloudtype YAML secret
        if: env.CLOUDTYPE_DEPLOY_YAML != ''
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          endpoint: https://app.cloudtype.io/api
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE || 'main' }}
          allStages: false
          yaml: ${{ secrets.CLOUDTYPE_DEPLOY_YAML }}
      - name: Deploy using committed original-app manifest
        if: env.CLOUDTYPE_DEPLOY_YAML == ''
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          endpoint: https://app.cloudtype.io/api
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE || 'main' }}
          allStages: false
          file: .cloudtype/app.yaml

      # Check the exact runtime source and regional evidence module before accepting a rollout.
      - name: Set up Node for production release verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require latest server and regional evidence in production
        run: node scripts/verify-cloudtype-regional-release.js --strict
      - name: Verify deployed regional service revision
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import os,time,json,urllib.request,urllib.parse
          url='https://jeongukdaeri.kr/taksong/busan/?release-check='+os.environ['DEPLOYED_COMMIT']
          last_failed=[]
          last_error=''
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=10) as response:
                      page=response.read().decode('utf-8')
                  with urllib.request.urlopen('https://jeongukdaeri.kr/taksongdaeri/',timeout=10) as response:
                      guide=response.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/daeri/daegu/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      daegu_page=response.read().decode('utf-8')
                  regional_brand_ok=('대구스마트대리운전' not in daegu_page
                    and '<figcaption style="text-align:center">대구대리운전 ·' in daegu_page)
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/daeri/incheon/ganghwa-gun/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      county_page=response.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/taksong/seoul/gangnam-gu/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      seoul_page=response.read().decode('utf-8')
                  county_region=county_page.split('id="nationwide-subareas-20261107"',1)[-1].split('</details>',1)[0]
                  seoul_region=seoul_page.split('id="nationwide-subareas-20261107"',1)[-1].split('</details>',1)[0]
                  official_towns=['강화읍','선원면','불은면','길상면','화도면','양도면','내가면','하점면','양사면','송해면','교동면','삼산면','서도면']
                  nationwide_dynamic_ok=('id="nationwide-subareas-20261107"' in county_page
                    and 'id="nationwide-subareas-20261107"' in seoul_page
                    and county_region.count('class="nationwide-child-region"')==13
                    and seoul_region.count('class="nationwide-child-region"')>0
                    and all((town+'대리운전</a>') in county_region for town in official_towns))
                  nationwide_cases=[
                      ('강화군양도면대리운전','인천광역시 강화군 양도면','daeri'),
                      ('서울강남구역삼동대리운전','서울특별시 강남구 역삼동','daeri'),
                      ('부산해운대구우동탁송비견적','부산광역시 해운대구 우동','taksong'),
                      ('세종나성동대리운전','세종특별자치시 (직할) 나성동','daeri'),
                      ('제주제주시연동탁송견적','제주특별자치도 제주시 연동','taksong')]
                  for word,place,kind in nationwide_cases:
                      q=urllib.parse.quote(word)
                      with urllib.request.urlopen(urllib.request.Request(
                          'https://jeongukdaeri.kr/api/region-card-preview?q='+q,
                          headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                          preview=json.loads(response.read().decode('utf-8'))
                      if not (preview.get('status')=='matched'
                          and preview.get('service')==kind
                          and preview.get('locality')==place
                          and any('/api/nationwide-locality-card.svg?' in c.get('image','') for c in preview.get('cards',[]))
                          and all(c.get('url','').startswith('/fare/?service='+kind) for c in preview.get('cards',[]) if word.endswith(('대리비견적','탁송비견적','탁송견적')))):
                          nationwide_dynamic_ok=False
                          break
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/fare/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      fare_page=response.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/?release-check='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      home=response.read().decode('utf-8')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/api/locality-suggest?q='+urllib.parse.quote('부산 해운대구')+'&service=taksong',
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      live_localities=json.loads(response.read().decode('utf-8'))
                  locality_live_ok=(
                    'id="nationwide-live-locality-20261107"' in home
                    and 'id="nationwide-live-query-20261107"' in home
                    and live_localities.get('service')=='taksong'
                    and any(x.get('full_name')=='부산광역시 해운대구'
                      and x.get('quote_url','').startswith('/fare/?service=taksong&from=')
                      for x in live_localities.get('items',[])))
                  regional_direct_quote_ok=(
                    'id="regional-direct-route-quote-20261107"' in page
                    and 'id="regional-direct-route-quote-20261107"' in county_page
                    and 'id="regional-direct-route-quote-20261107"' in seoul_page
                    and 'name="from" value="부산광역시"' in page
                    and 'name="auto" value="1"' in page
                    and 'smart24_explicit_quote_submit' in page)
                  mobile_quote_ok=(
                    'id="homepage-mobile-first-20261107"' in home
                    and 'id="homepage-fare-form"' in home
                    and home.index('id="homepage-fare-top"') < home.index('id="homepage-primary-services-20261106"')
                    and 'smart24_explicit_quote_submit' in home
                    and 'smart24_explicit_quote_submit' in fare_page
                    and "preset.get('auto')==='1'" in fare_page
                    and 'form.requestSubmit()' in fare_page
                    # Validate the real above-the-fold GET quote form instead of
                    # requiring five hard-coded anchors that the UI never renders.
                    and 'action="/fare/" method="get" id="homepage-fare-form"' in home
                    and 'name="auto" value="1"' in home
                    and 'name="from" required' in home
                    and 'name="to" required' in home
                    and 'name="service"' in home
                    and '<option value="taksong">탁송</option>' in home
                    and '<option value="daeri">대리운전</option>' in home
                    and 'href="tel:18114294"' in home
                    and all(term in fare_page for term in
                      ['대리비','대리비견적','탁송비','탁송견적','탁송비견적']))
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/assets/traffic-analytics.js?v='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      tracker=response.read().decode('utf-8')
                  with urllib.request.urlopen('https://jeongukdaeri.kr/favicon.ico',timeout=10) as response:
                      icon_ok=response.status==200 and response.headers.get('Content-Type','').startswith('image/')
                  with urllib.request.urlopen(urllib.request.Request(
                      'https://jeongukdaeri.kr/assets/traffic-summary.css?v='+os.environ['DEPLOYED_COMMIT'],
                      headers={'Cache-Control':'no-cache'}),timeout=10) as response:
                      traffic_css=response.read().decode('utf-8')
                  stats_ok=('오늘 접속' in home
                    and '누적 접속기록' in home
                    and '전화버튼 클릭' in home
                    and 'id="traffic-call-trigger"' in home
                    and 'id="exclude-my-visits"' in home
                    and 'id="phone-source-list"' in home
                    and 'id="top-fare-calculator"' in home
                    and '/routes/taksong/area-494/area-1174/' in home
                    # Check actual counter components rather than a retired
                    # release marker removed from the homepage source.
                    and all('id="'+item+'"' in home for item in
                      ['today-visit-number','total-visit-number','phone-click-number'])
                    and 'traffic-summary.css?v=20261030' in home
                    and 'smart24_exclude_own_visits_v1' in tracker
                    and 'smart24_last_recorded_visit_day' in tracker
                    and '.traffic-stats .traffic-stats-lines' in traffic_css
                    and '유입 경로 미확인' in tracker and 'acquisition();' in tracker)
                  region_stats_ok=('id="traffic-stats-panel"' in page
                    and 'id="exclude-my-visits"' in page)
                  checks={
                    'regional_breadcrumb':'BreadcrumbList' in page,
                    'regional_main_taksong_link':'href="/taksong/">전국 탁송' in page,
                    'guide_single_h1':guide.count('<h1>')==1,
                    'homepage_four_part_validity':'v.length===4' in home,
                    'favicon_image_http200':icon_ok,
                    'visitor_phone_statistics':stats_ok,
                    'regional_statistics':region_stats_ok,
                    'daegu_brand_label':regional_brand_ok,
                    'mobile_fare_quote':mobile_quote_ok,
                    'administrative_region_links':nationwide_dynamic_ok,
                    'locality_autocomplete':locality_live_ok,
                    'regional_direct_quote':regional_direct_quote_ok,
                  }
                  last_failed=[name for name,ok in checks.items() if not ok]
                  if not last_failed:
                      print('PASS: live Cloudtype stats, region labels, phone actions, and regional hierarchy verified')
                      break
                  # Keep the exact failing checks, rather than reporting a generic cache error
                  # after 20 minutes of retries without actionable evidence.
                  if attempt in (0,5,11,17,23):
                      print('Cloudtype live check %d/24 failed checks: %s' % (attempt+1, ', '.join(last_failed)),flush=True)
              except Exception as exc:
                  last_error='%s: %s' % (type(exc).__name__,str(exc)[:240])
                  if attempt in (0,5,11,17,23):
                      print('Cloudtype live check %d/24 request error: %s' % (attempt+1,last_error),flush=True)
              if attempt==23:
                  raise SystemExit('Cloudtype deployment accepted but live verification failed. Missing checks: %s. Last request error: %s' % (', '.join(last_failed) or 'unavailable after request failure',last_error or 'none'))
              time.sleep(5)
          PYVERIFY
      - name: Verify current Naver-focused and Seoul taksong editorial landing pages
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYNAVER'
          import os,time,urllib.request,xml.etree.ElementTree as ET
          base='https://jeongukdaeri.kr'
          expected={
            '/special/seoraksan-transport/':'<h1>설악산탁송 요금·실제후기',
            '/special/jirisan-transport/':'<h1>지리산탁송 요금·실제후기',
            '/special/cycling-trail-transport/':'<h1>전국 자전거길탁송 요금·실제후기',
            '/blog/seoul-taksong/':'<h1>서울탁송 25개 구',
            '/blog/seoul-taksong/gangnam-seocho-songpa-gangdong/':'<h1>강남·서초·송파·강동구 탁송',
            '/reviews/taksong/':'completed-case-conversion-first-202611',
            '/region/daegu-daeri-taksong/':'daegu-route-real-review-first-202611',
          }
          for attempt in range(18):
            missing=[]
            for path,text in expected.items():
              try:
                req=urllib.request.Request(base+path+'?release-check='+os.environ['DEPLOYED_COMMIT'],
                  headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
                with urllib.request.urlopen(req,timeout=12) as response:
                  html=response.read().decode('utf-8')
                  if response.status!=200 or text not in html or '1811-4294' not in html:
                    missing.append(path)
              except Exception as e:
                missing.append(path+': '+str(e))
            if not missing:
              print('PASS five latest customer-facing landing pages')
              break
            if attempt==17:
              raise SystemExit('Latest landing pages not deployed or stale: '+', '.join(missing))
            time.sleep(5)
          # Verify mobile search keyword routing and the first visible mountain poster on production.
          from urllib.parse import quote
          mountain_cases=[
            ('설악산탁송','seoraksan'),('한계령소공원탁송','seoraksan'),
            ('지리산탁송','jirisan'),('성삼재중산리탁송','jirisan')
          ]
          for keyword,mountain in mountain_cases:
            route='/'+('설악산탁송' if mountain=='seoraksan' else '지리산탁송')+'/'
            url=base+'/?q='+quote(keyword)+'&release-check='+os.environ['DEPLOYED_COMMIT']
            with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as response:
              page=response.read().decode('utf-8')
              landing=response.geturl()
            table='<section id="mountain-route-fare-table-202611"'
            poster='<figure id="original-mountain-fare-visual"'
            picture='/assets/'+mountain+'-taksong-fares.svg'
            # Original fare PNG must lead the canonical mobile page; the accessible
            # HTML fare table remains directly in the main page content.
            if quote(route) not in landing or table not in page or poster not in page or page.index(poster)>page.index(table) or not page.startswith('<!doctype html>') or ('src="'+picture+'"') not in page:
              raise SystemExit('Mountain original poster-first landing mismatch: '+keyword+' -> '+landing)
            image_req=urllib.request.Request(base+picture+'?release-check='+os.environ['DEPLOYED_COMMIT'],headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(image_req,timeout=15) as image_response:
              svg_content=image_response.read().decode('utf-8')
              if image_response.status!=200 or '<svg' not in svg_content or '<image' in svg_content or '<foreignObject' in svg_content:
                raise SystemExit('Mountain text-only fare SVG unavailable or embeds an image: '+picture)
            print('PASS mountain mobile route + text-only original fare SVG',keyword)
          # Korean SEO paths must be the public canonical, not duplicate legacy canonical URLs.
          for label,mountain in [('설악산탁송','seoraksan'),('지리산탁송','jirisan')]:
            route='/'+label+'/'
            req=urllib.request.Request(base+quote(route)+'?release-check='+os.environ['DEPLOYED_COMMIT'],headers={'Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=15) as response:
              page=response.read().decode('utf-8')
            if 'rel="canonical" href="'+base+route+'"' not in page or '/assets/'+mountain+'-taksong-fares.svg' not in page:
              raise SystemExit('Korean keyword canonical or original fare poster missing: '+route)
            print('PASS public Korean mountain URL',route)
          # Confirm the deployed server is reading the same current HTML files.
          import json
          probe=urllib.request.Request(base+'/health/seo.json?release-check='+os.environ['DEPLOYED_COMMIT'],
            headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
          with urllib.request.urlopen(probe,timeout=15) as response:
            data=json.loads(response.read().decode('utf-8'))
            if response.status!=200: raise SystemExit('SEO freshness probe HTTP '+str(response.status))
          expected_titles={
            'seoraksan':'설악산탁송 요금·실제후기',
            'jirisan':'지리산탁송 요금·실제후기',
            'cycling':'전국 자전거길탁송 요금·실제후기'
          }
          for key,phrase in expected_titles.items():
            if phrase not in data.get('pages',{}).get(key,{}).get('h1',''):
              raise SystemExit('Live source is outdated: '+key)
          if not all(x.get('hasPhone') for x in data.get('pages',{}).values()):
            raise SystemExit('SEO freshness probe missing phone on at least one page')
          print('PASS live source file freshness probe')
          req=urllib.request.Request(base+'/robots.txt?release-check='+os.environ['DEPLOYED_COMMIT'],
            headers={'Cache-Control':'no-cache','User-Agent':'Smart24-SEO-Deployment-Verify/1.0'})
          with urllib.request.urlopen(req,timeout=15) as response:
            payload=response.read().decode('utf-8')
            if response.status!=200: raise SystemExit('robots.txt HTTP '+str(response.status))
          if 'Sitemap: '+base+'/sitemap-priority.xml' not in payload:
            raise SystemExit('robots.txt missing priority sitemap')
          print('PASS /robots.txt')
          PYNAVER
      - name: Verify every owned live sitemap exactly once
        run: python3 scripts/verify-live-owned-sitemaps.py
      - name: Verify live taksong reviews and search sitemaps
        run: |
          python3 - <<'PYSEO'
          import time, urllib.request, xml.etree.ElementTree as ET
          base='https://jeongukdaeri.kr'
          paths=['/taksong/','/service/taksong/','/reviews/taksong/','/blog/']
          failed=[]
          for path in paths:
              ok=False
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(base+path,headers={'User-Agent':'Smart24-Release-Verification/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          body=response.read()
