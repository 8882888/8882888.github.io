             'gijang_exact_title':'<title>기장군탁송 |' in gijang and '<h1>기장군탁송 |' in gijang,
             'gijang_canonical':'rel="canonical" href="https://jeongukdaeri.kr/taksong/busan/gijang-gun/"' in gijang,
             'gijang_indexable':'<meta name="robots" content="noindex' not in gijang.lower(),
             'gijang_internal_link':'href="/taksong/busan/gijang-gun/"' in home,
             'technical_sitemap':bool(locs) and len(locs)<=499 and len(locs)==len(set(locs)),
             'ride_evidence':quality.get('checks',{}).get('historicalRideRecords')==2591,
          }
          print('Live HTTP/download samples (not phone Core Web Vitals):',json.dumps(samples,ensure_ascii=False))
          print('Five priority smoke checks:',json.dumps(checks,ensure_ascii=False))
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
