name: SMART24 production SEO smoke check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live SEO pages and sitemap XML
        run: python tests/production-seo-smoke.py
