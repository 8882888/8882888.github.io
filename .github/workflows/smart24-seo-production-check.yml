name: SMART24 production SEO smoke check
on:

  push:
    branches: [main]
    paths:
      - 'tests/production-seo-smoke.py'
  workflow_dispatch:
  schedule:
    - cron: "55 1 * * *"
permissions:
  contents: read
concurrency:
  # Cold-cache XML checks should never compete with another copy of this audit.
  group: smart24-production-sitemap-smoke
  cancel-in-progress: false
jobs:
  audit:
    # Never test a commit as deployed if Cloudtype rejected that release.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare against the exact revision deployed, not a later automated
          # keyword/archive commit on main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live SEO pages and sitemap XML
        run: python tests/production-seo-smoke.py
