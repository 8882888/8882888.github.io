name: Smart24 SEO audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/seo-audit.js'
      - 'scripts/regional-sitemap-audit.js'
      - 'scripts/regional-content-duplicates.js'
      - 'lib/keyword-engine.js'
      - 'lib/route-guides.js'
      - 'data/legal-regions/**'
      - 'data/seo-pages.json'
      - '.github/workflows/seo-audit.yml'
      - 'server.js'
      - 'index.html'
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: read
jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit script and configuration
        run: |
          node --check scripts/seo-audit.js
          node --check scripts/regional-sitemap-audit.js
          node --check scripts/regional-content-duplicates.js
          node -e "const c=require('./data/seo-pages.json'); if(!Array.isArray(c.pages)||!c.pages.length) process.exit(1)"
      - name: Install dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts
      - name: Start preview server
        run: |
          PORT=3000 node server.js > /tmp/smart24-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smart24-preview.log
          exit 1
      - name: Run SEO audit against proposed code
        run: |
          set -o pipefail
          node scripts/seo-audit.js http://localhost:3000/ | tee seo-audit-result.json
      - name: Audit full sitemap inventory and regional samples
        run: |
          set -o pipefail
          SEO_REPORT_PATH=regional-sitemap-result.json node scripts/regional-sitemap-audit.js http://localhost:3000/
      - name: Report regional content similarity
        run: |
          SEO_DUP_REPORT_PATH=regional-content-duplicates.json node scripts/regional-content-duplicates.js http://localhost:3000/ > /tmp/regional-duplicates.log
          node -e "const r=require('./regional-content-duplicates.json'); console.log(JSON.stringify({pagesChecked:r.pagesChecked,identicalBodies:r.identicalBodyClusters.length,titlePatterns:r.similarTitlePatternClusters.length,descriptionPatterns:r.similarDescriptionPatternClusters.length,errors:r.errors.length},null,2))"
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-seo-audit
          path: |
            seo-audit-result.json
            regional-sitemap-result.json
            regional-content-duplicates.json
          if-no-files-found: ignore
          retention-days: 30
