name: Smart24 SEO audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/seo-audit.js'
      - 'data/seo-pages.json'
      - 'data/priority-regions.json'
      - '.github/workflows/seo-audit.yml'
      - 'server.js'
      - 'tools/mark_github_pages_mirror_noindex.py'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'taksongdaeri/index.html'
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: read
jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GitHub mirror noindex transformation without touching production files
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from mark_github_pages_mirror_noindex import convert, NOINDEX
          source='<html><head><title>test</title><meta name="robots" content="index,follow"><link rel="canonical" href="https://jeongukdaeri.kr/"></head><body>backup</body></html>'
          result=convert(source)
          assert result.count(NOINDEX)==1
          assert 'content="index,follow"' not in result
          assert 'href="https://jeongukdaeri.kr/"' in result
          assert 'backup</body>' in result
          assert convert('<html><body>no head</body></html>')=='<html><body>no head</body></html>'
          print('PASS: only Pages HTML gets one noindex tag while canonical and content remain')
          PY
      - name: Validate audit script and configuration
        run: |
          node --check scripts/seo-audit.js
          node --check assets/traffic-analytics.js
          node tests/traffic-analytics.test.js
          node -e "const c=require('./data/seo-pages.json'); if(!Array.isArray(c.pages)||!c.pages.length) process.exit(1)"
      - name: Install dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts
      - name: Start preview server
        run: |
          PORT=3000 node server.js > /tmp/smart24-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/smart24-preview.log
          exit 1
      - name: Verify 17-province designated-driver blog editorial and original Naver links
        run: node tests/daeri-editorial.test.js
      - name: Verify live-equivalent IndexNow key and regional sitemap without external requests
        run: node scripts/indexnow-notify.js --dry-run http://localhost:3000/
      - name: Run SEO audit against proposed code
        run: |
          set -o pipefail
          node scripts/seo-audit.js http://localhost:3000/ | tee seo-audit-result.json
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart24-seo-audit
          path: seo-audit-result.json
          if-no-files-found: ignore
          retention-days: 30
