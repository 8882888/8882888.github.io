name: Audit official Cloudtype deployment and taksong SEO
on:
  workflow_dispatch:
  schedule:
    - cron: '25 22 * * *'
  push:
    branches: [main]
    paths:
      - server.js
      - index.html
      - data/seo-pages.json
      - tools/check_live_taksong_deploy.py
      - .github/workflows/official-production-audit.yml

permissions:
  contents: read

jobs:
  verify-official-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production audit script syntax
        run: python -m py_compile tools/check_live_taksong_deploy.py
      - name: Validate source before checking Cloudtype
        run: |
          node --check server.js
          node tools/check_cloudtype_20_point_readiness.js
          node tests/homepage-top-services.test.js
          node tests/taksong-priority-seo-links.test.js
      - name: Compare live Cloudtype deployment with GitHub files
        shell: bash
        run: |
          mkdir -p audit
          # Cloudtype and GitHub backup deploy independently. Give webhook-based
          # production builds time to finish before declaring the deployment stale.
          sleep 45
          set +e
          code=1
          for attempt in 1 2 3; do
            echo "=== Production inspection attempt $attempt/3 ==="
            python tools/check_live_taksong_deploy.py > "audit/attempt-$attempt.json"
            code=$?
            cp "audit/attempt-$attempt.json" audit/live-taksong-audit.json
            python - "$attempt" <<'PY'
          import json,sys,os
          attempt=sys.argv[1]
          with open('audit/live-taksong-audit.json',encoding='utf8') as f:
              report=json.load(f)
          failures=report.get('failures',[])
          diagnosis=report.get('diagnosis','UNKNOWN')
          print('Diagnosis:',diagnosis)
          print('Attempt',attempt,'result:', 'PASS' if not failures else 'FAILED')
          for message in failures:
              print('  -',message)
          h=report.get('checks',{}).get('health',{})
          if h.get('error'): print('  - production network error:',h['error'])
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf8') as out:
                  out.write('## Official production verification attempt '+attempt+'\n')
                  out.write('Result: '+('PASS' if not failures else 'FAILED')+'\n\n')
                  out.write('Diagnosis: `'+diagnosis+'`\n\n')
                  for item in failures: out.write('- '+item+'\n')
                  if h.get('error'): out.write('- Health endpoint: '+h['error']+'\n')
                  out.write('\n')
          PY
            if [ "$code" -eq 0 ]; then
              echo "PASS: Official Cloudtype is serving the expected source version."
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Cloudtype may still be building; rechecking after 45 seconds."
              sleep 45
            fi
          done
          if [ "$code" -ne 0 ]; then
            echo "::error::Production audit FAILED after 3 attempts. Open the job Summary or official-production-seo-audit artifact for exact mismatches. GitHub Pages backup is not the Cloudtype deployment."
          fi
          exit "$code"
      - name: Keep production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-production-seo-audit
          path: audit/live-taksong-audit.json
          if-no-files-found: warn
          retention-days: 14
