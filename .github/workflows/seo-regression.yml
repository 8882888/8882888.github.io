name: Regional SEO and SVG regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regional-seo:
    name: Region, sitemap and card SVG checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify bounded retries keep live JSON-LD audit transient-safe
        run: |
          node --check scripts/audit-live-structured-data.mjs
          node --test tests/indexability-retry.test.mjs
      - name: Check 80-character metadata and noindex-safe JSON-LD guard
        run: |
          node --check lib/seo-head-guard.cjs
          node --test tests/seo-head-guard.test.cjs
      - name: Protect verified route SEO boundaries and customer route search
        run: |
          node --check lib/route-keyword-pages.js
          node --check tests/route-indexability-boundary.test.cjs
          node --test tests/route-indexability-boundary.test.cjs
      - name: Verify aerial work truck keyword coverage and single canonical guide
        run: |
          node --check lib/special-vehicle-keywords.cjs
          node --check tests/special-vehicle-keywords.test.cjs
          node --test tests/special-vehicle-keywords.test.cjs
      - name: Verify nationwide 26 truck types, 27 tonnage intents and 17 province region canonicals
        run: |
          node --check lib/nationwide-truck-taksong.cjs
          node --check tests/nationwide-truck-types-20261122.test.cjs
          node --test tests/nationwide-truck-types-20261122.test.cjs
      - name: Verify 44 source-backed domestic, imported and truck service-center intents
        run: |
          node --check lib/service-center-taksong.cjs
          node --check tests/service-center-taksong-keywords-20261117.test.cjs
          node --test tests/service-center-taksong-keywords-20261117.test.cjs
      - name: Validate indexable service-center sitemap and schema.org JSON-LD
        run: |
          node --check lib/service-center-schema.cjs
          node --check scripts/audit-live-service-center-schema.mjs
          node --check tests/service-center-schema-indexability-20261117.test.cjs
          node --test tests/service-center-schema-indexability-20261117.test.cjs
      - name: Validate 28 reviewed originals and full 2900-document editorial quality delta
        run: |
          node --check tests/editorial-quality-verified-28-20261117.test.cjs
          node --test tests/editorial-quality-verified-28-20261117.test.cjs
          node scripts/ai-index-quality-triage.mjs
          node -e "const r=require('./ai-index-quality-review.json'); console.log('Editorial source quality: '+r.totals.fullyPassing+'/'+r.totals.reviewed+' passing; '+r.totals.needsReview+' for review. No Naver index measurement.');"
      - name: Prove live server loads all 33 nationwide source files without omissions
        run: |
          node --check tests/nationwide-runtime-source-parity-20261121.test.cjs
          node --test tests/nationwide-runtime-source-parity-20261121.test.cjs
      - name: Audit ALL 2900 local guides with 17-province and two-service balanced review coverage
        run: |
          node --check scripts/ai-index-quality-triage.mjs
          node --check tests/nationwide-evidence-coverage-20261121.test.cjs
          node --test tests/nationwide-evidence-coverage-20261121.test.cjs
      - name: Require 8 reviewed guides and factual Gangneung click-through snippets
        run: |
          node --check tests/editorial-quality-eight-ctr-20261117.test.cjs
          node --test tests/editorial-quality-eight-ctr-20261117.test.cjs
          node scripts/ai-index-quality-triage.mjs
          node -e "const r=require('./ai-index-quality-review.json'); const assert=require('node:assert/strict'); assert.equal(r.totals.reviewed,2900); assert(r.totals.fullyPassing>=365,'Editorial passing count regressed below the last reviewed baseline'); assert(r.totals.needsReview<=2535,'Editorial review queue grew above the prior baseline'); assert.equal(r.totals.fullyPassing+r.totals.needsReview,2900); console.log('Rubric: '+r.totals.fullyPassing+' passed, '+r.totals.needsReview+' for review. These are NOT Naver indexed counts.');"
      - name: Triage 2183 unresolved ride sources and dynamic editorial candidates without fabrication
        run: |
          node --check scripts/triage-unresolved-rides-and-content.mjs
          node --check tests/source-evidence-2183-2535-20261117.test.cjs
          node --test tests/source-evidence-2183-2535-20261117.test.cjs
          node --test tests/naver-official-scorecard.test.mjs
          node scripts/report-naver-official-scorecard.mjs
      - name: Save reviewable source-evidence queues and official metrics unknown-state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-review-2183-2535
          path: |
            ride-2183-original-evidence-triage.json
            ride-2183-original-evidence-triage.csv
            content-2535-evidence-first-review.json
            content-2535-evidence-first-review.csv
            naver-official-scorecard.json
            naver-official-scorecard.md
          if-no-files-found: warn
      - name: Verify six dated original local customer guides in HTTP and source records
        run: |
          node --check lib/source-backed-local-context.cjs
          node --check scripts/audit-live-six-local-source-guides.cjs
          node --test tests/live-six-local-source-audit-20261117.test.cjs
          node --check tests/source-backed-six-local-guides-20261117.test.cjs
          node --test tests/source-backed-six-local-guides-20261117.test.cjs
      - name: Cross-verify second six dated locality guides with 17 archived records and real Node HTTP
        run: |
          node --check scripts/audit-live-second-six-source-guides.cjs
          node --check tests/source-backed-second-six-guides-20261117.test.cjs
          node --test tests/source-backed-second-six-guides-20261117.test.cjs
      - name: Syntax-check deployed priority evidence-first and real HTTP parity audit
        run: node --check scripts/audit-live-priority-ctr-evidence.cjs
      - name: Verify 2591 archival ride records and exact evidence-region hub discovery
        run: |
          node --check lib/archived-ride-evidence-directory.cjs
          node --check tests/archived-ride-evidence-discovery-20261117.test.cjs
          node --test tests/archived-ride-evidence-discovery-20261117.test.cjs
      - name: Syntax-check live evidence directory audit without invoking production
        run: node --check scripts/audit-live-archive-discovery.cjs
      - name: Verify canonical keyword parity and bounded crawler HTML cache
        run: |
          node --check lib/regional-html-cache.cjs
          node --check tests/keyword-entrypoint-cache.test.cjs
          node --test tests/keyword-entrypoint-cache.test.cjs
      - name: Validate safe 17-province Pages mirror before nationwide production rollout
        run: |
          python3 -m py_compile tools/build_compact_pages_backup.py tests/test_compact_pages_backup.py
          python3 tests/test_compact_pages_backup.py
          python3 - <<'PY'
          from pathlib import Path
          yml=Path('.github/workflows/pages.yml').read_text(encoding='utf-8')
          assert 'path: _pages_mirror' in yml, 'Pages must only upload bounded static artifact'
          assert 'path: .' not in yml, 'Never expose entire ride/source repository via Pages'
          print('PASS bounded Pages artifact contract')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check scripts/audit-live-structured-data.mjs
          node --check tests/server.test.js
          node --check tests/visual-policy.test.js
          node --check tests/keyword-preview.test.js
          node --check assets/region-card-preview.js
          node --check lib/visual-policy.js
          node --check lib/homepage-copy.js
          node --check lib/blog-search-topics.js
          node --check lib/naver-blog-feed.js
          node --check lib/keyword-canonical-bridge.js
          node --check data/smart24-region-automation/lib/engine.js
          node --check data/smart24-region-automation/lib/enhance.js
          node --check scripts/blog-search-coverage.js
          node --check tests/homepage-copy.test.js
      - name: Verify nationwide taksong handover trust and metadata spelling
        run: node tests/taksong-trust-first.test.js
      - name: Validate the exact 100 source-release checks used by Pages backup
        run: node tools/check_cloudtype_100_point_release.js
      - name: Protect current nationwide and 24-hour dedicated keyword entry titles
        run: node tests/nationwide-daeri-24h-taksong-keywords.test.js
      - name: Validate all 18 Gangwon tourism food hotel pension golf and long-distance daeri guides
        run: node --test tests/gangwon-18-tourism-daeri-seo-20261122.test.cjs
      - name: Validate 38 Gyeongnam canonical pages and 18 original city county guides for both services
        run: node --test tests/gyeongnam-service-guides-18-20261122.test.cjs
      - name: Validate all 15 Chungnam municipalities, 18 actual port localities and SEO canonical aliases
        run: node --test tests/chungnam-ports-pension-fishing-20261122.test.cjs
      - name: Validate 32 Chungcheong municipality guides, 4 province links, Sejong and hotel pension keyword routes
        run: |
          node --check lib/chungcheong-4regions-stay-guide.cjs
          node --check tests/chungcheong-4regions-stay-20261122.test.cjs
          node --test tests/chungcheong-4regions-stay-20261122.test.cjs
      - name: Verify Iksan Busong central city/dong SEO and real keyword HTTP canonical redirects
        run: |
          node --check lib/iksan-busong-seo.cjs
          node --check tests/iksan-busong-seo-20261122.test.cjs
          node --test tests/iksan-busong-seo-20261122.test.cjs
      - name: Verify Iksan city and Busong published ride truth and search title clarity
        run: |
          node --check tests/iksan-published-evidence-meta-20261122.test.cjs
          node --test tests/iksan-published-evidence-meta-20261122.test.cjs
      - name: Verify Gangnam corporate postpaid, Yulhyeon dealer imported car locality and HTTP canonical SEO
        run: |
          node --check lib/gangnam-yulhyeon-b2b-seo.cjs
          node --check tests/gangnam-yulhyeon-b2b-20261122.test.cjs
          node --test tests/gangnam-yulhyeon-b2b-20261122.test.cjs
      - name: Syntax-check current production SEO auditors
        run: python3 -m py_compile tools/check_live_taksong_deploy.py tools/audit_live_seo.py
      - name: Confirm all curated region data edits affect the production deployment fingerprint
        run: node --test tests/curated-region-sources-fingerprint.test.js
      - name: Validate preferred Korean site name and structured data
        run: node tests/site-name.test.js
      - name: Verify 823k keyword intents resolve to regional canonical URLs
        run: node --test tests/keyword-canonical-bridge.test.js
      - name: Verify unchanged three-page CTR cohort and customer-first transport HTML
        run: |
          node --check tests/taksong-ctr-intent-cohort-20261117.test.cjs
          node --check scripts/audit-live-taksong-ctr-intent-20261117.cjs
          node --test tests/taksong-ctr-intent-cohort-20261117.test.cjs
      - name: Verify owner-sourced Naver web search CTR measurement without invented gains
        run: |
          node --check scripts/compare-naver-web-performance-20261117.mjs
          node --test tests/naver-web-real-ctr-scorecard-20261117.test.mjs
          node scripts/compare-naver-web-performance-20261117.mjs
          node --check scripts/measure-naver-four-official-kpis-20261118.mjs
          node --test tests/naver-four-official-kpi-deltas-20261118.test.mjs
          node scripts/measure-naver-four-official-kpis-20261118.mjs
      - name: Protect existing cycling course navigability and canonical evidence
        run: |
          node --check scripts/audit-live-cycling-user-shortcuts-20261117.mjs
          node --test tests/cycling-verified-shortcuts-and-ctr-20261117.test.mjs
      - name: Prevent unreviewed link farms and misleading official index baseline
        run: |
          node --check scripts/audit-live-reviewed-national-hubs-20261118.cjs
          node --check scripts/audit-live-taksong-ctr-intent-20261117.cjs
          node --test tests/national-review-first-discovery-20261118.test.cjs
      - name: Preserve business page canonical identity and industry-specific guidance
        run: node --test tests/business-indexability-content.test.mjs
      - name: Protect distinct original-supported business workflow steps
        run: |
          node --check scripts/audit-live-business-evidence-workflows-20261117.cjs
          node --check tests/business-specific-originals-20261117.test.cjs
          node --test tests/business-specific-originals-20261117.test.cjs
      - name: Require ten different innovation city service guides and priority source deployment fingerprint
        run: node --test tests/innovation-five-city-editorial.test.mjs
      - name: Verify ten additional innovation-area driver and delivery guides are distinct
        run: node --test tests/innovation-more-five-areas-editorial.test.mjs
      - name: Verify ten key city and coastal SEO guides reject generic source templates
        run: node --test tests/priority-coast-and-cities-editorial.test.mjs
      - name: Preserve 20 unique 부산·대구 pickup and handover guides for Naver
        run: node --test tests/naver-priority-20-local-guides-20261116.test.cjs
      - name: Preserve 16 high-priority regional guide edits and accurate Sejong locality boundaries
        run: node --test tests/priority-locality-editorial-20261115.test.mjs
      - name: Protect 24 additional Sejong, Wonju and Naju source-specific locality guides
        run: node --test tests/priority-locality-editorial-24-20261115.test.cjs
      - name: Verify 16 Sejong village, Wonju Munmak and Seoul service guides remain unique
        run: node --test tests/priority-locality-editorial-16-second-20261115.test.cjs
      - name: Protect public sitemap scope and release verifier from stale locality checks
        run: node --test tests/live-sitemap-scope.test.mjs
      - name: Test regional evidence-link audit classification
        run: node --test tests/indexability-scope.test.mjs
      - name: Ensure official Naver indexed count is not fabricated from crawl tests
        run: node --test tests/naver-official-scorecard.test.mjs
      - name: Verify read-only indexability retry behavior
        run: node --test tests/indexability-retry.test.mjs
      - name: Ensure verified village sitemap candidate lookup retains every genuine ride match
        run: node --test tests/verified-village-sitemap-candidates.test.cjs
      - name: Confirm exact verified city, county and province sitemap route parity
        run: node --test tests/verified-broad-region-sitemap-parity.test.cjs
      - name: Syntax-check production sitemap smoke test
        run: python3 -m py_compile tests/production-seo-smoke.py
      - name: Verify Cloudtype release hash check tolerates only a bounded rollout window
        run: python3 tests/test_production_seo_smoke_release.py
      - name: Verify live sitemap smoke is chained to Cloudtype release proof
        run: node --test tests/production-sitemap-smoke-workflow.test.cjs
      - name: Validate saved-case publication URLs and feed record integrity
        run: node --test tests/published-case-feed.test.js
      - name: Validate new content IndexNow URL selection
        run: node tests/indexnow-targeting.test.js
      - name: Validate Cloudtype release provenance diagnosis
        run: node --test tests/identify-cloudtype-release.test.js
      - name: Verify manual Cloudtype release can be checked after auto-deploy failure
        run: node --test tests/cloudtype-freshness-workflow.test.js
      - name: Reject false-positive retry of genuine SEO errors and preserve Cloudtype revision identity
        run: node --test tests/seo-audit-retry.test.cjs
      - name: Check vehicle/person image-removal policy
        run: node tests/visual-policy.test.js
      - name: Validate 100/1000-point auditing logic against approved safe SVG and v7 HTML images
        run: python3 -m unittest discover -s tests -p 'test_live_card_audits.py'
      - name: Match live SEO audit to safe cycling diagrams and fare-first homepage
        run: node --test tests/live-audit-current-visuals.test.mjs
      - name: Verify source-backed Busan review-first title compatibility
        run: python3 -m unittest discover -s tests -p 'test_busan_review_titles.py'
      - name: Test v3 regional automation (21 Node tests, 4 Python tools tests)
        run: |
          node --test data/smart24-region-automation/tests/*.test.js
          python3 -m unittest discover -s data/smart24-region-automation/tests -p 'test_*.py'
      - name: Verify regional v2 canonical pages, verified rides and noindex redirects
        run: node --test tests/regional-v2-integration.test.js
      - name: Verify six cycling-course mobile direct-call buttons
        run: node tests/cycling-mobile-call.test.js
      - name: Check keyword-to-text-image previews
        run: node tests/keyword-preview.test.js
      - name: Verify public Naver-blog SEO topic matching and mobile call CTAs
        run: node tests/blog-search-topics.test.js
      - name: Verify Naver RSS fallback and safe public source rendering
        run: node tests/blog-feed-render.test.js
      - name: Generate 18-topic published-title coverage audit
        run: node scripts/blog-search-coverage.js > /tmp/blog-search-coverage.json
      - name: Check retired homepage copy is removed, not keyword search
        run: node tests/homepage-copy.test.js
      - name: Check sitemap and cycling center regression
        run: npm run check:seo
      - name: Run real HTTP regional SEO regression
        env:
          CI: 'true'
        run: node tests/server.test.js
