name: Regional SEO and SVG regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regional-seo:
    name: Region, sitemap and card SVG checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check tests/server.test.js
          node --check tests/visual-policy.test.js
          node --check tests/keyword-preview.test.js
          node --check assets/region-card-preview.js
          node --check lib/visual-policy.js
          node --check lib/homepage-copy.js
          node --check lib/blog-search-topics.js
          node --check lib/naver-blog-feed.js
          node --check lib/keyword-canonical-bridge.js
          node --check data/smart24-region-automation/lib/engine.js
          node --check data/smart24-region-automation/lib/enhance.js
          node --check scripts/blog-search-coverage.js
          node --check tests/homepage-copy.test.js
      - name: Validate preferred Korean site name and structured data
        run: node tests/site-name.test.js
      - name: Verify 823k keyword intents resolve to regional canonical URLs
        run: node --test tests/keyword-canonical-bridge.test.js
      - name: Test regional evidence-link audit classification
        run: node --test tests/indexability-scope.test.mjs
      - name: Validate Cloudtype release provenance diagnosis
        run: node --test tests/identify-cloudtype-release.test.js
      - name: Verify manual Cloudtype release can be checked after auto-deploy failure
        run: node --test tests/cloudtype-freshness-workflow.test.js
      - name: Check vehicle/person image-removal policy
        run: node tests/visual-policy.test.js
      - name: Test v3 regional automation (21 Node tests, 4 Python tools tests)
        run: |
          node --test data/smart24-region-automation/tests/*.test.js
          python3 -m unittest discover -s data/smart24-region-automation/tests -p 'test_*.py'
      - name: Verify regional v2 canonical pages, verified rides and noindex redirects
        run: node --test tests/regional-v2-integration.test.js
      - name: Verify six cycling-course mobile direct-call buttons
        run: node tests/cycling-mobile-call.test.js
      - name: Check keyword-to-text-image previews
        run: node tests/keyword-preview.test.js
      - name: Verify public Naver-blog SEO topic matching and mobile call CTAs
        run: node tests/blog-search-topics.test.js
      - name: Verify Naver RSS fallback and safe public source rendering
        run: node tests/blog-feed-render.test.js
      - name: Generate 18-topic published-title coverage audit
        run: node scripts/blog-search-coverage.js > /tmp/blog-search-coverage.json
      - name: Check retired homepage copy is removed, not keyword search
        run: node tests/homepage-copy.test.js
      - name: Check sitemap and cycling center regression
        run: npm run check:seo
      - name: Run real HTTP regional SEO regression
        env:
          CI: 'true'
        run: node tests/server.test.js
