<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대리운전·전국탁송 예상요금 조회 | 스마트전국대리운전 스마트24탁송</title>
<meta name="description" content="대리운전과 전국 자동차탁송의 도로거리 및 참고요금을 확인하세요. 예약 상담 1811-4294.">
<link rel="canonical" href="https://jeongukdaeri.kr/fare/">
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17253b;font:17px/1.65 Arial,'Malgun Gothic',sans-serif}header{background:#102544;color:white;padding:22px 5%}header a{color:#ffe16a}main{max-width:650px;margin:22px auto;padding:0 15px}section{background:#fff;padding:25px;margin:15px 0;border:1px solid #d2dce8;border-radius:14px}h1{font-size:clamp(25px,5vw,35px);line-height:1.3;margin:10px 0}label{display:block;font-weight:800;margin:18px 0 6px}input,select{width:100%;padding:15px;font:inherit;border:2px solid #a8b8ca;border-radius:9px}button,.btn{display:block;width:100%;padding:15px;background:#ffdf55;color:#102544;border:0;border-radius:9px;font-size:19px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer;margin-top:20px}.btn{background:#102544;color:#fff}#result{margin-top:18px;padding:18px;border-radius:10px;background:#eef4fb;white-space:pre-line}#result[hidden]{display:none}.price{font-size:30px;font-weight:900;color:#114b83}small{color:#4a5a70}p{margin:8px 0}</style></head>
<body><header><a href="/">← 스마트24탁송 홈</a><h1>대리운전 · 전국탁송 요금 조회</h1><p>출발지와 도착지만 입력하세요.</p></header>
<main><section><form id="quote-form"><label for="service">서비스 선택</label><select id="service"><option value="daeri">대리운전</option><option value="taksong">자동차탁송</option></select><label for="from">출발지</label><input id="from" required placeholder="예: 서울역 또는 서울특별시 중구 서울역" autocomplete="street-address"><label for="to">도착지</label><input id="to" required placeholder="예: 부산역 또는 부산광역시 동구 부산역" autocomplete="off"><button id="submit" type="submit">거리·예상요금 조회</button></form>
<div id="result" role="status" aria-live="polite" hidden></div>
<p><small>도로거리 기준 참고금액이며 대리운전은 탁송 대비 약 30% 가산합니다. 장거리 구간은 추정식으로 계산하며, 확정 견적이 아닙니다. 시간대, 기사 수급, 차종, 통행료 등에 따라 최종 견적은 달라질 수 있습니다.</small></p>
<a class="btn" href="tel:18114294">☎ 예약·빠른배차 상담 1811-4294</a></section></main>
<script>
const form=document.getElementById('quote-form'),result=document.getElementById('result'),submit=document.getElementById('submit');
const worker='https://white-voice-6eab.k337711.workers.dev/route';
function quote(km,service){const bands=km<=20?[12000,20000]:km<=50?[20000,30000]:km<=100?[30000,50000]:km<=200?[50000,80000]:km<=300?[80000,110000]:null;const base=bands?bands:[110000+Math.max(0,km-300)*400];const multiplier=service==='daeri'?1.3:1;return base.map(n=>Math.ceil(n*multiplier/5000)*5000)}
form.addEventListener('submit',async e=>{e.preventDefault();result.hidden=false;result.textContent='실제 도로거리를 조회하고 있습니다…';submit.disabled=true;
const from=document.getElementById('from').value.trim(),to=document.getElementById('to').value.trim(),service=document.getElementById('service').value;
const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
try{const res=await fetch(worker+'?'+new URLSearchParams({from,to}),{signal:controller.signal});if(!res.ok)throw Error('route unavailable');const data=await res.json();const km=Number(data.distanceKm),mins=Number(data.durationMinutes);if(!Number.isFinite(km)||km<=0)throw Error('invalid distance');let band=quote(km,service);const norm=x=>x.replace(/\s+/g,'').toLowerCase();const isSokcho=norm(from).includes('속초'),isIncheon=norm(to).includes('인천');if(isSokcho&&isIncheon){const local=[100000,120000];band=service==='daeri'?local.map(n=>Math.ceil(n*1.3/5000)*5000):local;}result.replaceChildren();const heading=document.createElement('strong');heading.textContent=from+' → '+to;result.append(heading,document.createElement('br'));result.append('도로거리 약 '+Math.round(km).toLocaleString('ko-KR')+'km');if(Number.isFinite(mins)&&mins>0)result.append(' · 예상 '+Math.round(mins)+'분');result.append(document.createElement('br'));const price=document.createElement('div');price.className='price';price.textContent=(service==='daeri'?'대리운전':'자동차탁송')+' 예상 참고요금 '+band.map(n=>n.toLocaleString('ko-KR')+'원').join(' ~ ');result.append(price);const note=document.createElement('small');note.textContent=isSokcho&&isIncheon?'속초 출발·인천 도착 지역 참고 사례를 우선 적용했습니다. 실제 배차요금은 조건에 따라 달라집니다.':service==='daeri'?'대리운전 참고요금은 탁송 기준 대비 약 30% 가산한 추정치입니다. 시간대·기사 수급·복귀 조건에 따라 달라집니다.':'탁송 참고요금은 거리별 추정치이며 확정 견적이 아닙니다.';result.append(note);
}catch(err){result.textContent='현재 자동 거리 조회가 연결되지 않습니다. 주소를 확인해 다시 조회하거나 1811-4294로 문의해 주세요. 거리와 요금을 임의로 표시하지 않습니다.'}finally{clearTimeout(timer);submit.disabled=false}});
</script></body></html>
